<!DOCTYPE html>

<head>

    <link id="favicon" rel="icon" type="image/png" href="https://lh3.google.com/u/0/d/1YkUNkaQc2mfZ3ptjyoH8Nge93eznBWvK=w1920-h919-iv1?auditContext=prefetch">
    
    <!-- Tailwind CSS -->

    <script>
        tailwind.config = {

                    colors: {
                        nswPurple: '#4c1d95',

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .sidebar { background-color: #4c1d95; }
        .sidebar-item { color: #d1d5db; transition: all 0.2s; border-left: 4px solid transparent; cursor: pointer; }
        .sidebar-item:hover, .sidebar-item.active { background-color: rgba(255, 255, 255, 0.1); border-left-color: #facc15; color: #ffffff; }
        
        .sidebar-nav::-webkit-scrollbar { width: 5px; }
        .sidebar-nav::-webkit-scrollbar-track { background: #4c1d95; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 10px; }

        body.swal2-shown:not(.swal2-no-backdrop):not(.swal2-toast-shown) { padding-right: 0 !important; overflow: hidden !important; }
        .swal2-container { z-index: 9999 !important; padding-right: 0 !important; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #7c3aed; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal { transition: opacity 0.3s ease-in-out, visibility 0.3s; opacity: 0; visibility: hidden; pointer-events: none; }
        .modal.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease-in-out; }
        .modal.active .modal-content { transform: scale(1); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Mobile Overlay -->

    <!-- SIDEBAR -->

        <div class="p-4 border-t border-white/20 bg-black/20">

    <!-- MAIN CONTENT -->
    <main id="mainContent" class="flex-1 flex flex-col h-full overflow-y-auto bg-gray-50 w-full relative">
        
        <header class="bg-nswPurple text-white px-4 py-12 flex flex-col justify-center items-center shadow-md relative">
            <div class="md:hidden absolute top-4 left-4">

            <div class="absolute top-4 right-4 md:top-6 md:right-6 z-10">

                    <input type="text" id="filterSearch" oninput="applyFilters()" placeholder="ค้นหาชื่อเอกสาร..." class="bg-transparent border-none outline-none text-white group-focus-within:text-gray-800 placeholder-purple-200 group-focus-within:placeholder-gray-400 text-sm ml-2 w-32 sm:w-48 transition-all">
                </div>

            <h1 class="text-3xl md:text-5xl font-bold mb-4 text-center drop-shadow-md tracking-tight">ระบบจัดเก็บเอกสารออนไลน์</h1>
            <h2 class="text-lg md:text-xl font-medium mb-2 text-center text-purple-100 opacity-90">โรงเรียนโนนศิลาสว่างวิทย์</h2>
            
            <button id="btnUpload" onclick="openUploadModal()" class="mt-6 bg-white text-nswPurple hover:bg-gray-100 px-6 py-2.5 rounded-full font-bold shadow-xl transform transition hover:-translate-y-1 flex items-center gap-2">
                <i class="fas fa-cloud-upload-alt text-xl"></i> อัปโหลดเอกสารใหม่

        <div class="flex-1 p-4 md:p-8 w-full max-w-7xl mx-auto flex flex-col">
            
            <!-- ตัวกรอง -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">ประเภทเอกสาร</label>

                        <option value="">-- ทั้งหมด --</option>
                        <option value="คำสั่งปฏิบัติหน้าที่">คำสั่งปฏิบัติหน้าที่</option>
                        <option value="คำสั่งแต่งตั้งคณะกรรมการ">คำสั่งแต่งตั้งคณะกรรมการ</option>
                        <option value="คำสั่งพานักเรียนเข้าร่วมแข่งขัน">คำสั่งพานักเรียนเข้าร่วมแข่งขัน</option>
                        <option value="คำสั่งไปราชการ/อบรม">คำสั่งไปราชการ/อบรม</option>
                        <option value="ประกาศ/ระเบียบโรงเรียน">ประกาศ/ระเบียบโรงเรียน</option>

                </div>
                <div>

                    <input type="text" id="filterTermYear" oninput="applyFilters()" placeholder="เช่น 2/2568" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">กลุ่มงาน</label>
                    <select id="filterDept" onchange="applyFilters()" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none bg-white">
                        <option value="">-- ทั้งหมด --</option>
                        <option value="งานบริหารวิชาการ">งานบริหารวิชาการ</option>
                        <option value="งานบริหารงบประมาณ">งานบริหารงบประมาณ</option>
                        <option value="งานบริหารงานบุคคล">งานบริหารงานบุคคล</option>
                        <option value="งานบริหารทั่วไป">งานบริหารทั่วไป</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-between items-end mb-4">
                <h3 id="tableLabel" class="text-xl font-bold text-gray-800 border-l-4 border-nswButtonPurple pl-3">เอกสารทั้งหมด</h3>
                <span id="docCountBadge" class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm">กำลังโหลด...</span>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex-1 mb-10">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-600 border-b">
                            <tr>
                                <th class="px-4 py-4 w-12 text-center">ID</th>
                                <th class="px-4 py-4 min-w-[200px]">ชื่อเอกสาร</th>
                                <th class="px-4 py-4 w-32">ประเภท</th>
                                <th class="px-4 py-4 w-24 text-center">เทอม/ปี</th>
                                <th class="px-4 py-4 w-40">ผู้อัปโหลด</th>
                                <th class="px-4 py-4 w-28 text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="docListContainer" class="divide-y divide-gray-100">
                            <tr><td colspan="6" class="text-center py-20 text-gray-400"><div class="loader mx-auto mb-3"></div>กำลังโหลดข้อมูล...</td></tr>

    <!-- JAVASCRIPT -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzo3bZcUf2Zm9KomKSICkWKdmWy6l4h2oPn-N2AYiZ8kdzDjm3lu5jWtaBtAAZaG5c/exec';
        const LOGIN_API_URL = 'https://script.google.com/macros/s/AKfycbxIcgvezV9cr9jpyxBxt_SOx4DjNoYH22KpZ7RR5-k23f4rhWKdw00XZLug9NZu0K_0Xg/exec';

        let state = { user: null, documents: [], viewMode: 'active' };
        let idleTimer;
        const DEFAULT_IDLE_MINUTES = 60;

        function normalizeFrontendRole(r) {
            if(!r) return '🎒 นักผจญภัยฝึกหัด';
            if(r.includes('Dragon')) return '🐲 นักรบมังกร';
            if(r.includes('High Mage')) return '🧙‍♂️ จอมเวทย์อาวุโส';
            if(r.includes('Grand Master')) return '⚔️ ปรมาจารย์ชั้นยอด';
            if(r.includes('Vanguard')) return '🏹 นักผจญภัยแนวหน้า';
            if(r.includes('Apprentice')) return '🎒 นักผจญภัยฝึกหัด';
            return r;
        }

        // ================= AUTH SYSTEM (Fixed 1:1 match with PorPor5) =================

        function checkAuth() {
            const savedUser = localStorage.getItem('nswUser');
            if (savedUser) {
                const lastActive = localStorage.getItem('nswLastActive');
                const savedTimeout = parseInt(localStorage.getItem('nswIdleTimeout')) || DEFAULT_IDLE_MINUTES;
                if (lastActive) {
                    const diffMs = Date.now() - parseInt(lastActive);
                    const diffMins = Math.floor(diffMs / 60000);
                    if (diffMins >= savedTimeout) {
                        localStorage.removeItem('nswUser');
                        localStorage.removeItem('nswLastActive');
                        showLoginPopup();
                        return;
                    }
                }

                state.user = JSON.parse(savedUser);
                state.user.role = normalizeFrontendRole(state.user.role);
                
                document.getElementById('sidebarUserName').innerText = state.user.name;
                document.getElementById('sidebarUserRole').innerText = state.user.position || state.user.role || 'บุคลากร';
                document.getElementById('sidebarUserImg').src = state.user.image || `https://ui-avatars.com/api/?name=${encodeURIComponent(state.user.name)}&background=4c1d95&color=ffffff`;

                const roleStr = (state.user.role || '').toLowerCase();
                const isAdmin = roleStr.includes('นักรบมังกร') || roleStr.includes('จอมเวทย์อาวุโส') || roleStr.includes('admin');
                if (isAdmin) document.getElementById('adminLogsBtn')?.classList.remove('hidden');
                
                // แสดงปุ่มออกจากระบบ
                document.getElementById('logoutBtn').classList.remove('hidden');

                if (!sessionStorage.getItem('logged_doc_system')) {
                    logSystemAccess();
                    sessionStorage.setItem('logged_doc_system', 'true');
                }
                
                resetIdleTimer();
                fetchDocuments();
            } else {
                // ซ่อนปุ่มต่างๆ เมื่อยังไม่ได้ Login
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('adminLogsBtn')?.classList.add('hidden');
                showLoginPopup();
            }
        }

        function showLoginPopup() {
            Swal.fire({
                scrollbarPadding: false,
                heightAuto: false,
                width: '22rem',
                padding: '2rem 1rem 1rem 1rem',
                showTitle: false,
                backdrop: 'rgba(15, 23, 42, 0.7) backdrop-blur-sm',
                // ล็อกไม่ให้หายไปเมื่อกดด้านนอกหรือปุ่ม ESC
                allowOutsideClick: false,
                allowEscapeKey: false,
                html: `
                    <div class="text-center font-sarabun">
                        <div class="w-20 h-20 mx-auto bg-purple-50 rounded-full flex items-center justify-center mb-4 shadow-inner border-4 border-white relative">
                            <i class="fas fa-file-shield text-4xl text-nswButtonPurple relative z-10"></i>
                            <div class="absolute inset-0 bg-purple-200 rounded-full animate-ping opacity-30"></div>
                        </div>
                        <h2 class="text-xl font-bold text-nswPurple mb-1">เข้าสู่ระบบคลังเอกสาร</h2>
                        <p class="text-xs text-purple-600 mb-6 font-medium">กรุณายืนยันตัวตนเพื่อเข้าใช้งาน</p>
                        <div class="space-y-3 text-left px-2">
                            <div class="relative">
                                <i class="fas fa-user absolute left-3 top-3.5 text-purple-400 text-sm"></i>
                                <input type="text" id="sw-user" class="w-full bg-purple-50/50 border border-purple-200 rounded-2xl py-3 pl-10 pr-4 text-sm focus:ring-2 focus:ring-nswButtonPurple focus:bg-white outline-none transition-all placeholder-purple-300 text-nswPurple font-medium" placeholder="ชื่อผู้ใช้งาน">
                            </div>
                            <div class="relative">
                                <i class="fas fa-key absolute left-3 top-3.5 text-purple-400 text-sm"></i>
                                <input type="password" id="sw-pass" class="w-full bg-purple-50/50 border border-purple-200 rounded-2xl py-3 pl-10 pr-4 text-sm focus:ring-2 focus:ring-nswButtonPurple focus:bg-white outline-none transition-all placeholder-purple-300 text-nswPurple font-medium" placeholder="รหัสผ่าน">
                            </div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'เข้าสู่ระบบ <i class="fas fa-arrow-right ml-1"></i>',
                cancelButtonText: '<i class="fas fa-home mr-1"></i> กลับเว็บหลัก',
                buttonsStyling: false,
                customClass: {
                    popup: 'rounded-[2rem] shadow-2xl border-4 border-purple-50 bg-white overflow-hidden',
                    actions: 'flex flex-col gap-2 w-full px-6 mt-6 pb-2',
                    confirmButton: 'w-full bg-nswButtonPurple hover:bg-nswButtonHover text-white rounded-2xl px-4 py-3 text-sm font-bold shadow-md m-0 font-sarabun',
                    cancelButton: 'w-full bg-gray-50 hover:bg-gray-100 text-gray-500 rounded-2xl px-4 py-3 text-sm font-bold border border-gray-200 m-0 font-sarabun'
                },
                didOpen: () => {
                    const uIn = document.getElementById('sw-user');
                    const pIn = document.getElementById('sw-pass');
                    const handleEnter = (e) => { if (e.key === 'Enter') Swal.clickConfirm(); };
                    uIn.addEventListener('keyup', handleEnter);
                    pIn.addEventListener('keyup', handleEnter);
                    uIn.focus();
                },
                preConfirm: () => {
                    const u = document.getElementById('sw-user').value;
                    const p = document.getElementById('sw-pass').value;
                    if (!u || !p) return Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบถ้วน 🥺');
                    return { u, p };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await handleLogin(result.value.u, result.value.p);
                } else if (result.dismiss === Swal.DismissReason.cancel) {
                    goToMainWeb();
                }
            });
        }

        async function handleLogin(u, p) {
            Swal.fire({ 
                title: 'กำลังตรวจสอบข้อมูล... 🔐', 
                allowOutsideClick: false, 
                showConfirmButton: false,
                didOpen: () => Swal.showLoading() 
            });
            try {
                const res = await fetch(`${LOGIN_API_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`, { method: 'POST' });
                const json = await res.json();
                if (json.status === 'success') {
                    localStorage.setItem('nswUser', JSON.stringify(json.user));
                    localStorage.setItem('nswLastActive', Date.now().toString());
                    Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'เข้าสู่ระบบสำเร็จ!', showConfirmButton: false, timer: 1500 }).then(() => window.location.reload());
                } else {
                    Swal.fire('เข้าสู่ระบบไม่สำเร็จ', json.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error').then(showLoginPopup);
                }
            } catch (e) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error').then(showLoginPopup);
            }
        }

        function logout() {
            Swal.fire({
                title: 'ออกจากระบบ?', text: 'คุณต้องการออกจากระบบจัดเก็บเอกสารใช่หรือไม่?', icon: 'question',
                showCancelButton: true, confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444'
            }).then((res) => {
                if (res.isConfirmed) {
                    localStorage.removeItem('nswUser');
                    localStorage.removeItem('nswLastActive');
                    window.location.reload();
                }
            });
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (!state.user) return;
            localStorage.setItem('nswLastActive', Date.now().toString());
            let minutes = parseInt(localStorage.getItem('nswIdleTimeout')) || DEFAULT_IDLE_MINUTES;
            idleTimer = setTimeout(() => {
                localStorage.removeItem('nswUser');
                window.location.reload();
            }, minutes * 60 * 1000);
        }

        // ================= DOCUMENT LOGIC =================

        async function fetchDocuments() {
            try {
                const res = await fetch(`${API_URL}?action=getDocuments`);
                const json = await res.json();
                if (json.status === 'success') {
                    state.documents = json.data;
                    updateBadges();
                    applyFilters();
                }
            } catch (e) { console.error(e); }
        }

        function updateBadges() {
            const active = state.documents.filter(d => d.status !== 'trashed').length;
            const trashed = state.documents.filter(d => d.status === 'trashed').length;
            document.getElementById('activeCountBadge').innerText = active;
            document.getElementById('trashTotalBadge').innerText = trashed;
        }

        function applyFilters() {
            const fSearch = document.getElementById('filterSearch').value.toLowerCase();
            const fType = document.getElementById('filterType').value;
            const fTerm = document.getElementById('filterTermYear').value;
            const fDept = document.getElementById('filterDept').value;

            const filtered = state.documents.filter(doc => {
                const matchMode = state.viewMode === 'active' ? (doc.status !== 'trashed') : (doc.status === 'trashed');
                const matchSearch = !fSearch || doc.title.toLowerCase().includes(fSearch);
                const matchType = !fType || doc.docType === fType;
                const matchTerm = !fTerm || (doc.termYear && doc.termYear.includes(fTerm));
                const matchDept = !fDept || doc.department === fDept;
                return matchMode && matchSearch && matchType && matchTerm && matchDept;
            });
            renderTable(filtered);
        }

        function renderTable(data) {
            const container = document.getElementById('docListContainer');
            document.getElementById('docCountBadge').innerText = `${data.length} รายการ`;

            if (!data.length) {
                container.innerHTML = `<tr><td colspan="6" class="text-center py-20 text-gray-400">ไม่พบรายการเอกสาร</td></tr>`;
                return;
            }

            const isAdmin = state.user.role.includes('นักรบมังกร') || state.user.role.includes('จอมเวทย์อาวุโส') || state.user.role.includes('Admin');

            container.innerHTML = data.map(doc => {
                const canEdit = doc.uploader === state.user.name || isAdmin;
                return `
                <tr class="hover:bg-purple-50 transition border-b border-gray-100 text-xs md:text-sm">
                    <td class="px-4 py-4 text-center text-gray-400 font-mono">${doc.id}</td>
                    <td class="px-4 py-4">
                        <div class="flex items-center gap-2">
                            <i class="fas ${doc.fileUrl?.includes('pdf') ? 'fa-file-pdf text-red-500' : 'fa-file-image text-purple-500'}"></i>
                            <a href="${doc.fileUrl}" target="_blank" class="font-bold text-gray-800 hover:text-purple-700 truncate max-w-[250px] block">${doc.title}</a>
                        </div>
                        <div class="text-[10px] text-gray-400 mt-1">อัปโหลดเมื่อ: ${doc.timestamp}</div>
                    </td>
                    <td class="px-4 py-4 text-xs"><span class="bg-gray-100 px-2 py-1 rounded-full font-bold">${doc.docType}</span></td>
                    <td class="px-4 py-4 text-center font-bold">${doc.termYear}</td>
                    <td class="px-4 py-4 text-gray-600">${doc.uploader}</td>
                    <td class="px-4 py-4 text-center">
                        <div class="flex justify-center gap-1">
                            ${state.viewMode === 'active' ? `
                                ${canEdit ? `<button onclick="editDoc(${doc.id})" class="w-8 h-8 rounded-full bg-yellow-50 text-yellow-600 hover:bg-yellow-100 transition"><i class="fas fa-pen"></i></button>` : ''}
                                <button onclick="softDelete(${doc.id}, '${doc.title}')" class="w-8 h-8 rounded-full bg-red-50 text-red-600 hover:bg-red-100 transition"><i class="fas fa-trash"></i></button>
                            ` : `
                                <button onclick="restoreDoc(${doc.id}, '${doc.title}')" class="w-8 h-8 rounded-full bg-green-50 text-green-600 hover:bg-green-100 transition"><i class="fas fa-undo"></i></button>
                                ${isAdmin ? `<button onclick="hardDelete(${doc.id}, '${doc.title}')" class="w-8 h-8 rounded-full bg-red-600 text-white hover:bg-red-700 transition shadow"><i class="fas fa-times"></i></button>` : ''}
                            `}
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        // ================= CRUD HELPERS =================

        async function softDelete(id, title) {
            Swal.fire({
                title: 'ย้ายลงถังขยะ?', text: `ต้องการลบ "${title}" ใช่หรือไม่?`, icon: 'warning',
                showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    const form = new FormData(); form.append('id', id); form.append('requestUser', state.user.name); form.append('requestRole', state.user.role);
                    const r = await fetch(`${API_URL}?action=deleteDocument`, { method: 'POST', body: form });
                    const j = await r.json();
                    if (j.status === 'success') fetchDocuments();
                }
            });
        }

        async function restoreDoc(id, title) {
            const form = new FormData(); form.append('id', id); form.append('requestUser', state.user.name); form.append('requestRole', state.user.role);
            const r = await fetch(`${API_URL}?action=restoreDocument`, { method: 'POST', body: form });
            const j = await r.json();
            if (j.status === 'success') fetchDocuments();
        }

        async function hardDelete(id, title) {
            Swal.fire({
                title: 'ลบถาวร!', text: `คำเตือน: "${title}" จะถูกลบทิ้งจาก Google Drive ทันที`, icon: 'error',
                showCancelButton: true, confirmButtonText: 'ลบถาวร', confirmButtonColor: '#000'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    const form = new FormData(); form.append('id', id); form.append('requestUser', state.user.name); form.append('requestRole', state.user.role);
                    const r = await fetch(`${API_URL}?action=permanentDeleteDocument`, { method: 'POST', body: form });
                    const j = await r.json();
                    if (j.status === 'success') fetchDocuments();
                }
            });
        }

        // ================= MISC UI =================

        function switchView(mode) {
            state.viewMode = mode;
            document.getElementById('menuActive').classList.toggle('active', mode === 'active');
            document.getElementById('menuTrash').classList.toggle('active', mode === 'trashed');
            document.getElementById('tableLabel').innerText = mode === 'active' ? 'เอกสารทั้งหมด' : 'ถังขยะ (Recycle Bin)';
            document.getElementById('btnUpload').style.display = mode === 'active' ? 'flex' : 'none';
            applyFilters();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function toggleSidebar() {
            document.getElementById('sidebarMenu').classList.toggle('-translate-x-full');
            document.getElementById('mobileOverlay').classList.toggle('hidden');
        }

        function goToMainWeb() { window.location.href = 'index.html'; }

        async function logSystemAccess() {
            if (!state.user) return;
            const f = new FormData(); f.append('requestUser', state.user.name); f.append('requestRole', state.user.role);
            fetch(`${API_URL}?action=logAccess`, { method: 'POST', body: f }).catch(() => {});
        }

        ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart'].forEach(e => document.addEventListener(e, resetIdleTimer, true));
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
