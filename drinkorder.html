<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ดื่มไรดี แก๊งค์</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet" />
    
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2210%22 width=%2280%22 height=%2280%22 rx=%2215%22 fill=%22%23f97316%22 stroke=%22%23111827%22 stroke-width=%2210%22/><path d=%22M30 60 Q50 80 70 60 Q50 40 30 60 Z%22 fill=%22%23111827%22/></svg>">

  <style>
    :root {
      --border-dark: #111827;
      --bg-color: #f8f9fa;
      --brand-color: #f97316;
    }

    body {
      font-family: "Itim", cursive, sans-serif;
      background-color: var(--bg-color);
      color: var(--border-dark);
      background-image: radial-gradient(#d1d5db 1px, transparent 1px);
      background-size: 20px 20px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Neo-Brutalist Core Classes */
    .neo-box {
      background-color: #ffffff;
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      box-shadow: 4px 4px 0px 0px var(--border-dark);
      transition: all 0.2s ease;
    }

    .neo-btn {
      background-color: #ffffff;
      border: 3px solid var(--border-dark);
      border-radius: 8px;
      box-shadow: 3px 3px 0px 0px var(--border-dark);
      font-weight: 700;
      color: var(--border-dark);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .neo-btn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px 0px var(--border-dark);
    }

    .neo-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px 0px var(--border-dark);
    }

    .neo-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: 0px 0px 0px 0px var(--border-dark);
      transform: translate(2px, 2px);
    }

    .neo-btn-primary { background-color: #fde047; }
    .neo-btn-success { background-color: #86efac; }
    .neo-btn-danger { background-color: #fca5a5; }
    .neo-btn-info { background-color: #93c5fd; }
    .neo-btn-brand { background-color: var(--brand-color); color: white; }

    .neo-input {
      border: 3px solid var(--border-dark);
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 3px 3px 0px 0px var(--border-dark);
      transition: all 0.2s;
    }

    .neo-input:focus {
      outline: none;
      box-shadow: 5px 5px 0px 0px var(--border-dark);
      transform: translate(-2px, -2px);
    }

    .neo-badge {
      border: 2px solid var(--border-dark);
      box-shadow: 2px 2px 0px 0px var(--border-dark);
      font-weight: 700;
    }

    /* Select styling */
    select.neo-input {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      /* เพิ่มไอคอนลูกศรที่ดูหนาและเข้ากับธีม */
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111827' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2em;
      cursor: pointer;
      /* เผื่อพื้นที่ด้านขวาไม่ให้ตัวหนังสือทับลูกศร */
      padding-right: 2.5rem;
    }

    /* ปรับแต่งตอนคลิก (Focus) ให้เด้งขึ้นมา (ไม่ให้จมค้าง) */
    select.neo-input:focus {
      outline: none;
      box-shadow: 5px 5px 0px 0px var(--border-dark); /* เด้งขึ้นมาเหมือน input ปกติ */
      transform: translate(-2px, -2px); /* ลอยขึ้นเล็กน้อย */
      background-color: #fde047; /* เปลี่ยนสีพื้นหลังให้เด่นขึ้น */
    }
    
    /* เพิ่มคลาสนี้ เพื่อให้กล่องจมลงไปเฉพาะ 'จังหวะที่กดคลิก' เท่านั้น */
    select.neo-input:active {
      box-shadow: inset 3px 3px 0px 0px rgba(0,0,0,0.1);
      transform: translate(2px, 2px);
    }
    
    /* ซ่อนลูกศรเริ่มต้นของ IE/Edge */
    select.neo-input::-ms-expand {
      display: none;
    }

    /* Radio button custom styling */
    .radio-card input:checked + div {
      background-color: #fde047;
      /* แก้ไขเงาและ transform เพื่อให้ปุ่มเด้งกลับขึ้นมา */
      box-shadow: 3px 3px 0px 0px var(--border-dark); 
      transform: none; 
    }
    
    .drink-card.ordered {
      background-color: #fff7ed;
      border-color: var(--brand-color);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-left: 2px solid var(--border-dark); }
    ::-webkit-scrollbar-thumb { background: #9ca3af; border: 2px solid var(--border-dark); border-radius: 4px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* สไตล์สำหรับปุ่มรูปแบบที่กดไม่ได้ (เมนูนั้นไม่มีขาย) */
    .radio-card input:disabled + div {
      background-color: #f3f4f6;
      color: #9ca3af;
      border-color: #d1d5db;
      box-shadow: none;
      transform: translate(2px, 2px);
      cursor: not-allowed;
    }
  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden bg-[var(--bg-color)]">

  <header class="bg-white border-b-4 border-[#111827] z-20 shrink-0">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-[var(--brand-color)] text-white w-10 h-10 rounded-xl border-2 border-black flex items-center justify-center neo-badge shadow-[2px_2px_0_0_#000]">
          <i class="fa-solid fa-face-smile-wink text-xl"></i>
        </div>
        <h1 class="text-xl font-black uppercase tracking-tight">
          ดื่มไรดี <span class="text-[var(--brand-color)]">แก๊งค์</span>
        </h1>
      </div>

      <div id="user-profile-btn" class="flex items-center gap-2 bg-gray-100 px-2 py-1 rounded-lg border-2 border-black cursor-pointer neo-badge hover:bg-gray-200 transition" onclick="openProfileModal()">
        <div id="header-avatar" class="w-8 h-8 rounded-full border-2 border-black flex items-center justify-center text-sm"></div>
        <span id="header-name" class="font-bold text-sm hidden sm:block truncate max-w-[100px]"></span>
      </div>
    </div>
  </header>

  <div class="bg-white border-b-2 border-black z-10 shrink-0">
    <div class="max-w-3xl mx-auto flex">
      <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-3 font-black text-center border-r-2 border-black bg-[#fde047] transition">
        <i class="fa-solid fa-mug-hot mr-2"></i> สั่งเครื่องดื่ม
      </button>
      <button onclick="switchTab('summary')" id="tab-summary" class="relative flex-1 py-3 font-bold text-center text-gray-500 hover:bg-gray-100 transition">
        <i class="fa-solid fa-clipboard-list mr-2"></i> สรุปออเดอร์
        <span id="summary-badge" class="absolute top-1.5 right-4 bg-[#f87171] text-white text-[10px] font-black min-w-[20px] px-1 h-[20px] flex items-center justify-center rounded-full border-2 border-black shadow-[2px_2px_0px_#000] hidden">0</span>
      </button>
    </div>
  </div>

  <main class="flex-1 overflow-y-auto relative">
    <div class="max-w-3xl mx-auto p-4 pb-24">
      
      <div id="view-menu" class="space-y-6">
        
        <div id="my-orders-container" class="space-y-3 hidden">
          <!-- Inject by JS -->
        </div>

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
          </div>
          <input type="text" id="search-input" oninput="handleSearch()" class="neo-input w-full pl-10 pr-10 py-3 font-bold text-lg" placeholder="ค้นหาเมนู (เช่น ชาเขียว, มอคค่า)...">
          
          <div id="clear-search-btn" class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer hidden" onclick="clearSearch()">
            <i class="fa-solid fa-circle-xmark text-gray-400 hover:text-red-500 text-xl transition-colors"></i>
          </div>
        </div>

        <div class="flex justify-between items-end">
          <h2 class="text-2xl font-black uppercase"><i class="fa-solid fa-book-open text-blue-500"></i> เมนูเครื่องดื่ม</h2>
          <div class="flex gap-2">
            <button onclick="openOrderModal('custom')" class="text-sm font-bold bg-[#d8b4fe] border-2 border-black px-2 py-1 rounded shadow-[2px_2px_0_0_#000] active:translate-y-[2px] active:shadow-none transition-all">
              <i class="fa-solid fa-pen-to-square mr-1"></i> พิมพ์เอง
            </button>
            <button onclick="loadOrdersFromSheet()" class="text-sm font-bold bg-white border-2 border-black px-2 py-1 rounded shadow-[2px_2px_0_0_#000] active:translate-y-[2px] active:shadow-none transition-all">
              <i class="fa-solid fa-rotate mr-1"></i> รีเฟรช
            </button>
          </div>
        </div>

        <div id="drink-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <!-- Drinks injected via JS -->
        </div>
      </div>

      <div id="view-summary" class="hidden space-y-6">
        <div class="neo-box bg-[#fde047] p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
          <div>
            <h2 class="text-2xl font-black uppercase"><i class="fa-solid fa-users text-blue-500"></i> สรุปการสั่งซื้อ</h2>
            <p class="font-medium text-sm">รายการออเดอร์ทั้งหมดของทีม</p>
          </div>
          <div class="bg-white px-4 py-2 border-2 border-black rounded-lg neo-badge text-center shrink-0">
            <span class="block text-xs font-bold text-gray-500 uppercase">ยอดรวม</span>
            <span id="total-count" class="text-xl font-black">0 แก้ว</span>
          </div>
        </div>

        <div class="neo-box overflow-hidden bg-white p-0">
          <div id="summary-list" class="flex flex-col">
            <!-- Summary items injected via JS -->
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Order Modal -->
  <div id="order-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 transition-opacity duration-200 opacity-0 pointer-events-none">
    <div id="order-modal-content" class="neo-box bg-white w-full max-w-md p-0 overflow-hidden transform scale-95 transition-transform duration-300 rounded-xl flex flex-col max-h-[90vh]">
      
      <div class="bg-[#93c5fd] p-4 border-b-[3px] border-black flex justify-between items-center shrink-0">
        <h3 id="modal-drink-name" class="text-xl font-black uppercase truncate pr-4">สั่งเครื่องดื่ม</h3>
        <input type="text" id="modal-drink-name-input" class="neo-input w-full px-3 py-2 font-bold hidden" placeholder="พิมพ์ชื่อเมนูที่ต้องการ...">
        <button onclick="closeOrderModal()" class="bg-white border-2 border-black w-8 h-8 rounded-full font-black flex items-center justify-center hover:bg-gray-200 shrink-0 ml-2">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto flex-1 space-y-6 bg-gray-50">
        <div id="modal-cup-count-info" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-2 rounded-lg border-2 border-blue-300 shadow-[2px_2px_0_0_#93c5fd] hidden mb-2"></div>
        <input type="hidden" id="input-drink-id">
        <input type="hidden" id="input-drink-name">

        <div>
          <label class="block font-black text-sm mb-2 uppercase"><i class="fa-solid fa-temperature-half"></i> รูปแบบ</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="radio-card cursor-pointer relative">
              <!-- เพิ่ม id="type-hot" -->
              <input type="radio" id="type-hot" name="drink_type" value="ร้อน" class="sr-only">
              <div class="neo-btn w-full py-3 text-sm font-bold border-2 border-black bg-white">♨️ ร้อน</div>
            </label>
            <label class="radio-card cursor-pointer relative">
              <!-- เพิ่ม id="type-iced" -->
              <input type="radio" id="type-iced" name="drink_type" value="เย็น" class="sr-only" checked>
              <div class="neo-btn w-full py-3 text-sm font-bold border-2 border-black bg-white">🧊 เย็น</div>
            </label>
            <label class="radio-card cursor-pointer relative">
              <!-- เพิ่ม id="type-frappe" -->
              <input type="radio" id="type-frappe" name="drink_type" value="ปั่น" class="sr-only">
              <div class="neo-btn w-full py-3 text-sm font-bold border-2 border-black bg-white">🌪️ ปั่น</div>
            </label>
          </div>
        </div>

        <div>
          <label class="block font-black text-sm mb-2 uppercase"><i class="fa-solid fa-spoon"></i> ความหวาน</label>
          <select id="input-sweetness" class="neo-input w-full px-4 py-3 font-bold text-lg bg-white" onchange="this.blur()">
            <option value="0%">0% (ไม่หวานเลย)</option>
            <option value="25%">25% (หวานน้อยมาก)</option>
            <option value="50%">50% (หวานน้อย)</option>
            <option value="100%" selected>100% (หวานปกติ)</option>
            <option value="125%">125% (หวานมาก)</option>
          </select>
        </div>

        <div>
          <label class="block font-black text-sm mb-2 uppercase"><i class="fa-solid fa-pen"></i> หมายเหตุ (ถ้ามี)</label>
          <input type="text" id="input-note" class="neo-input w-full px-4 py-3 font-medium" placeholder="เช่น แยกน้ำแข็ง, เพิ่มช็อต">
        </div>

        <div>
          <label class="block font-black text-sm mb-2 uppercase"><i class="fa-solid fa-cubes"></i> จำนวนแก้ว</label>
          <div class="flex items-center gap-4">
            <button type="button" onclick="changeQuantity(-1)" class="w-12 h-12 rounded-xl border-3 border-black font-black text-2xl flex items-center justify-center hover:bg-gray-200 active:translate-y-[2px] bg-white shadow-[2px_2px_0_0_#000] transition-all">-</button>
            <div class="flex-1 text-center bg-white border-3 border-black rounded-xl py-2 shadow-[inset_2px_2px_0_0_rgba(0,0,0,0.1)]">
               <span id="input-quantity-display" class="font-black text-2xl w-full">1</span>
            </div>
            <input type="hidden" id="input-quantity" value="1">
            <button type="button" onclick="changeQuantity(1)" class="w-12 h-12 rounded-xl border-3 border-black font-black text-2xl flex items-center justify-center hover:bg-[#fef08a] active:translate-y-[2px] bg-[#fde047] shadow-[2px_2px_0_0_#000] transition-all">+</button>
          </div>
        </div>
      </div>

      <div class="p-4 bg-white border-t-[3px] border-black flex gap-3 shrink-0">
        <button onclick="closeOrderModal()" class="neo-btn w-1/3 py-3">ยกเลิก</button>
        <button onclick="submitOrder()" class="neo-btn neo-btn-brand w-2/3 py-3 text-lg">
          <i class="fa-solid fa-check mr-2"></i> ยืนยันการสั่ง
        </button>
      </div>

    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="custom-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 transition-opacity duration-200 opacity-0 pointer-events-none">
    <div id="custom-modal-content" class="neo-box max-w-sm w-full p-6 transform scale-95 transition-transform duration-200 text-center">
      <div id="custom-modal-icon" class="text-5xl mb-4"></div>
      <h3 id="custom-modal-title" class="text-xl font-black mb-2 uppercase"></h3>
      <p id="custom-modal-message" class="font-medium mb-6 leading-relaxed"></p>
      <div id="custom-modal-actions" class="flex gap-3 justify-center">
      </div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[80] hidden flex items-center justify-center p-4 transition-opacity duration-200 opacity-0 pointer-events-none">
    <div id="profile-modal-content" class="neo-box max-w-sm w-full p-6 transform scale-95 transition-transform duration-200 text-center">
      <h3 class="text-xl font-black mb-4 uppercase bg-[#d8b4fe] p-2 border-2 border-black rounded neo-badge inline-block">ข้อมูลผู้ใช้ของคุณ</h3>
      
      <div class="flex justify-center mb-4">
        <div id="profile-big-avatar" class="w-20 h-20 rounded-full border-4 border-black flex items-center justify-center text-4xl shadow-[4px_4px_0_0_#000]"></div>
      </div>
      
      <div class="text-left mb-6">
        <!-- จัดกลุ่ม Label และ ปุ่มให้อยู่บรรทัดเดียวกัน -->
        <div class="flex justify-between items-end mb-1">
          <label class="block font-black text-xs text-gray-500 uppercase">ชื่อของคุณ</label>
          <!-- ปุ่มล้างข้อความ สีเหลือง นูนๆ -->
          <button type="button" onclick="document.getElementById('edit-profile-name').value = ''; document.getElementById('edit-profile-name').focus();" class="bg-[#fde047] border-2 border-black text-black text-[10px] font-black px-2 py-0.5 rounded shadow-[2px_2px_0_0_#000] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i class="fa-solid fa-eraser mr-1"></i>ล้าง
          </button>
        </div>
        
        <input type="text" id="edit-profile-name" class="neo-input w-full px-4 py-2 font-bold text-center text-lg" placeholder="ใส่ชื่อของคุณ">
        <p class="text-[10px] font-medium text-gray-500 mt-2 text-center">ระบบสุ่มรูปประจำตัวและสีให้ตามอุปกรณ์ อัปเดตชื่อเพื่อหาออเดอร์ง่ายขึ้น</p>
      </div>

      <div class="flex gap-3">
        <button onclick="closeProfileModal()" class="neo-btn w-1/2 py-2">ปิด</button>
        <button onclick="saveProfile()" class="neo-btn neo-btn-success w-1/2 py-2"><i class="fa-solid fa-save mr-2"></i> บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Loading Modal -->
  <div id="loading-modal" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[110] hidden flex flex-col items-center justify-center p-4">
    <div class="text-5xl text-black mb-4 animate-bounce">
      <i class="fa-solid fa-mug-hot"></i>
    </div>
    <h3 id="loading-title" class="text-xl font-black uppercase bg-[#fde047] px-4 py-2 border-[3px] border-black shadow-[4px_4px_0_0_#000] rounded-xl">
      กำลังโหลดข้อมูล...
    </h3>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx85Rz3TBcN6R2JwoDP7qGFSjucMLy60W3A0TBUkB-kT-QBbPfuA-6b4KQYERPd2HE/exec";

    const MENU_ITEMS = [
      // ชา (Tea) - ย้ายมาไว้หมวดแรกสุด
      { id: 'm10', name: 'ชาเขียวนม (Green Tea with Milk)', type: 'tea', icon: 'fa-leaf', color: 'bg-green-300', opts: {h:1, i:1, f:1} },
      { id: 'm12', name: 'ชานม (Thai Milk Tea)', type: 'tea', icon: 'fa-glass-water', color: 'bg-orange-300', opts: {h:1, i:1, f:1} },
      { id: 'm11', name: 'มัทฉะลาเต้ (Matcha Latte)', type: 'tea', icon: 'fa-leaf', color: 'bg-green-600 text-white', opts: {h:1, i:1, f:1} },
      { id: 'm13', name: 'ชาดำ (Black Tea)', type: 'tea', icon: 'fa-glass-water', color: 'bg-red-800 text-white', opts: {h:0, i:1, f:0} },
      { id: 'm14', name: 'ชามะนาว (Lemon Tea)', type: 'tea', icon: 'fa-lemon', color: 'bg-yellow-400', opts: {h:0, i:1, f:0} },

    function formatSweetness(val) {
      if (val === undefined || val === null || val === '') return 'หวาน 100% (ปกติ)';
      const strVal = String(val).trim();
      if (strVal === '0%' || strVal === '0') return 'หวาน 0% (ไม่หวานเลย)';
      if (strVal === '25%' || strVal === '0.25') return 'หวาน 25% (หวานน้อยมาก)';
      if (strVal === '50%' || strVal === '0.5') return 'หวาน 50% (หวานน้อย)';
      if (strVal === '100%' || strVal === '1') return 'หวาน 100% (ปกติ)';
      if (strVal === '125%' || strVal === '1.25') return 'หวาน 125% (หวานมาก)';
      return `หวาน ${strVal}`;
    }

      myOrders.forEach(o => {
          all.push({ ...o, user: currentUser, isMe: true, ts: o.ts || Date.now() });
      });
      return all.sort((a, b) => a.ts - b.ts);

        const rId = 'u_' + Math.random().toString(36).substr(2, 9);
        
        // สุ่มชื่อคนแปลกหน้าพร้อมตัวเลข 0-99
        const randomName = 'คนแปลกหน้า_' + Math.floor(Math.random() * 100);
        
        // กำหนดชื่อเริ่มต้นเป็นคนแปลกหน้า
        currentUser = { id: rId, name: randomName, icon: rIcon, color: rColor };

    function startAutoRefresh() {

    async function loadOrdersFromSheet(isSilent = false) {
      if (GAS_WEB_APP_URL === "ใส่_URL_WEB_APP_ของคุณที่นี่") return;
      if (!isSilent) showLoading(true, "กำลังดึงข้อมูลออเดอร์...");
      
      try {
        const response = await fetch(GAS_WEB_APP_URL + "?action=getOrders");
        const result = await response.json();
        
        if (result.orders) {
          if (result.globalLockTime !== undefined) {
             lockedTimestamp = result.globalLockTime;
             localStorage.setItem('happy_cup_locked_ts', lockedTimestamp);
          }

          const newTeamOrders = result.orders.filter(o => o.userId !== currentUser.id).map(o => ({
             ...o,
             status: o.status || 'ACTIVE',
             ts: new Date(o.timestamp).getTime() || 0
          }));

          const newOrdersCount = newTeamOrders.filter(o => o.ts > lockedTimestamp && o.status !== 'CANCELLED').length;
          const currentNewCount = teamOrders.filter(o => o.ts > lockedTimestamp && o.status !== 'CANCELLED').length;

          if (isSilent && newOrdersCount > currentNewCount) {
             notificationSound.currentTime = 0; 
             notificationSound.play().catch(e => console.log("Audio play blocked by browser:", e));
          }

          teamOrders = newTeamOrders;
          
          // ตรวจสอบข้อมูลส่วนตัวกับ Cloud ถ้าออเดอร์โดนเคลียร์ไปแล้ว จะทำให้ myOrders ในเครื่องว่างตามอัตโนมัติ
          const myCloudOrders = result.orders.filter(o => o.userId === currentUser.id);
          myOrders = myCloudOrders.map(o => ({
              id: o.orderId,
              drinkId: o.drinkId,
              drinkName: o.drinkName,
              type: o.type,
              sweetness: o.sweetness,
              note: o.note,
              status: o.status || 'ACTIVE',
              ts: new Date(o.timestamp).getTime() || Date.now()
          }));
          localStorage.setItem('amazon_my_orders', JSON.stringify(myOrders));
          
          renderMenu(document.getElementById('search-input').value);
          updateBadgeCount();
          
          if(isViewingSummary) {
             renderSummary();
          }
          renderMyOrdersBanner();
        }
      } catch (error) {
        console.error("Fetch error: ", error);
      }
      if (!isSilent) showLoading(false);
    }

    function renderMenu(searchQuery = '') {
      const grid = document.getElementById('drink-grid');
      grid.innerHTML = '';

      const CATEGORY_NAMES = {
        coffee_black: '<i class="fa-solid fa-mug-hot text-stone-800 mr-2"></i> กาแฟดำ (Black Coffee)',
        coffee_milk: '<i class="fa-solid fa-mug-saucer text-amber-800 mr-2"></i> กาแฟนม (Milk Coffee)',
        tea: '<i class="fa-solid fa-leaf text-green-600 mr-2"></i> ชา (Tea)',
        milk: '<i class="fa-solid fa-cow text-blue-500 mr-2"></i> นมและช็อกโกแลต (Milk & Chocolate)',
        smoothie: '<i class="fa-solid fa-blender text-pink-500 mr-2"></i> ผลไม้และสมูทตี้ (Fruit & Smoothies)',
        light: '<i class="fa-solid fa-seedling text-green-500 mr-2"></i> กลุ่ม Light / Fresh',
        premium: '<i class="fa-solid fa-crown text-yellow-500 mr-2"></i> Amazon Selected (Premium)'
      };

      let currentCategory = '';
      const q = searchQuery.toLowerCase().trim();

      MENU_ITEMS.forEach(drink => {
        if (q && !drink.name.toLowerCase().includes(q) && !drink.type.toLowerCase().includes(q)) return;

        if (!q && drink.type !== currentCategory) {
          currentCategory = drink.type;
          const header = document.createElement('div');
          header.className = 'col-span-full text-xl font-black mt-6 mb-2 flex items-center bg-gray-200 px-3 py-2 rounded-lg border-2 border-black shadow-[2px_2px_0_0_#000]';
          header.innerHTML = CATEGORY_NAMES[drink.type] || drink.type;
          grid.appendChild(header);
        }

        // นับเฉพาะแก้วที่ไม่ได้ถูกยกเลิก
        const myOrderedCount = myOrders.filter(o => o.drinkId === drink.id && o.status !== 'CANCELLED').length;
        const isOrdered = myOrderedCount > 0;
        
        const card = document.createElement('div');
        card.className = `neo-box p-4 flex flex-col justify-between cursor-pointer drink-card ${isOrdered ? 'ordered' : 'bg-white'}`;
        card.onclick = () => openOrderModal(drink.id);

        let myBadge = isOrdered 
          ? `<div class="absolute -top-3 -right-3 bg-black text-[#fde047] text-[10px] font-black px-2 py-1 rounded-md border-2 border-white shadow-sm z-10"><i class="fa-solid fa-star"></i> สั่ง ${myOrderedCount} แก้ว</div>` 
          : '';

        // จัดรูปแบบแยกชื่อภาษาไทยและภาษาอังกฤษให้อยู่คนละบรรทัด
        let displayName = drink.name;
        if (displayName.includes(' (')) {
          let parts = displayName.split(' (');
          // parts[0] คือชื่อไทย, parts[1] คือชื่ออังกฤษ (เอาวงเล็บกลับมาใส่ด้วย)
          displayName = `${parts[0]}<br><span class="text-[10px] font-bold text-gray-500 block mt-1 leading-tight">(${parts[1]}</span>`;
        }

        card.innerHTML = `
          ${myBadge}
          <div class="relative flex-1 flex flex-col items-center text-center">
            <div class="w-16 h-16 rounded-full border-3 border-black flex items-center justify-center text-3xl mb-3 shadow-[2px_2px_0_0_#000] ${drink.color}">
              <i class="fa-solid ${drink.icon}"></i>
            </div>
            <h3 class="font-black text-sm leading-tight mb-2">${displayName}</h3>
          </div>
          <button class="neo-btn ${isOrdered ? 'bg-white' : 'neo-btn-primary'} w-full py-2 text-xs mt-2">
            <i class="fa-solid fa-plus"></i> เพิ่มแก้วนี้
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function renderMyOrdersBanner() {
      const container = document.getElementById('my-orders-container');
      container.innerHTML = '';
      
      if (myOrders.length > 0) {
        // นับเฉพาะที่ไม่ได้ยกเลิก
        const activeCount = myOrders.filter(o => o.status !== 'CANCELLED').length;
        container.innerHTML = `<h3 class="font-black text-sm uppercase bg-black text-white px-2 py-1 rounded inline-block mb-1">ออเดอร์ของคุณ (${activeCount} แก้ว)</h3>`;
        
        const groupedMyOrders = {};
        myOrders.forEach(order => {
            // เพิ่มการจัดกลุ่มแยกด้วย Status 
            const key = `${order.drinkId}_${order.drinkName}_${order.type}_${order.sweetness}_${order.note || ''}_${order.status || 'ACTIVE'}`;
            if (!groupedMyOrders[key]) {
                groupedMyOrders[key] = {
                    ...order,
                    count: 0,
                    ids: [], 
                    maxTs: 0 
                };
            }
            groupedMyOrders[key].count++;
            groupedMyOrders[key].ids.push(order.id);
            if(order.ts > groupedMyOrders[key].maxTs) groupedMyOrders[key].maxTs = order.ts;
        });

        Object.values(groupedMyOrders).forEach(group => {
           let drinkName = group.drinkName;
           let iconHtml = '<i class="fa-solid fa-mug-hot text-gray-500 mr-2"></i>';
           
           if(group.drinkId !== 'custom') {
               const drinkObj = MENU_ITEMS.find(m => m.id === group.drinkId);
               if(drinkObj) iconHtml = `<i class="fa-solid ${drinkObj.icon} mr-2"></i>`;
           } else {
               iconHtml = '<i class="fa-solid fa-pen-to-square text-purple-500 mr-2"></i>';
           }

           const sweetnessText = formatSweetness(group.sweetness);
           const countBadge = group.count > 1 ? `<span class="bg-white text-black px-1.5 py-0.5 rounded-full text-[10px] border border-black ml-1 shadow-sm font-black">x${group.count}</span>` : '';

           // โลจิกสำหรับการแสดงปุ่มลบ หรือการขีดฆ่า
           const isCancelled = group.status === 'CANCELLED';
           const isLocked = group.maxTs <= lockedTimestamp;
           
           const deleteButtonHtml = isCancelled 
              ? `<div class="bg-gray-200 text-red-500 w-8 h-8 rounded border-2 border-gray-400 flex items-center justify-center shrink-0" title="ยกเลิกแล้ว"><i class="fa-solid fa-ban text-xs"></i></div>`
              : (isLocked 
                  ? `<div class="bg-gray-300 text-gray-500 w-8 h-8 rounded border-2 border-gray-400 flex items-center justify-center shrink-0 cursor-not-allowed" title="ออเดอร์นี้ถูกสั่งร้านไปแล้ว ไม่สามารถยกเลิกได้"><i class="fa-solid fa-lock text-xs"></i></div>`
                  : `<button onclick="cancelMyOrderGroup('${group.ids.join(',')}')" class="bg-red-500 text-white w-8 h-8 rounded border-2 border-black flex items-center justify-center shrink-0 active:translate-y-[2px]" title="ยกเลิกออเดอร์">
                      <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>`);

           const textStyles = isCancelled ? 'text-red-600 line-through opacity-70' : (isLocked ? 'text-gray-600' : 'text-black');
           const bgBoxStyle = isCancelled ? 'bg-red-50 border-red-300 border-dashed' : (isLocked ? 'bg-gray-100 border-gray-400 border-solid' : 'bg-[#86efac] border-black shadow-[2px_2px_0_0_#000] border-solid');

           container.innerHTML += `
            <div class="neo-box ${bgBoxStyle} p-3 flex flex-row items-center justify-between gap-2 border-2">
              <div class="flex-1 truncate">
                <div class="font-bold text-sm ${textStyles} truncate flex items-center">${iconHtml} <span class="truncate">${drinkName}</span> ${countBadge}</div>
                <div class="text-xs font-medium text-gray-800 truncate ${isCancelled ? 'opacity-50' : ''}">${group.type} | ${sweetnessText} ${group.note ? `| ${group.note}` : ''} ${isLocked && !isCancelled ? '<span class="text-[10px] text-red-500 font-bold ml-1">(สั่งร้านแล้ว)</span>' : ''}</div>
              </div>
              ${deleteButtonHtml}
            </div>
           `;
        });
        
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    function changeQuantity(delta) {
      const qtyInput = document.getElementById('input-quantity');
      const qtyDisplay = document.getElementById('input-quantity-display');
      let currentVal = parseInt(qtyInput.value, 10);
      let newVal = currentVal + delta;
      
      if (newVal < 1) newVal = 1;
      if (newVal > 20) newVal = 20; 
      
      qtyInput.value = newVal;
      qtyDisplay.innerText = newVal;
    }

    function renderSummary() {
      const list = document.getElementById('summary-list');
      list.innerHTML = '';

      let allOrders = [...teamOrders];
      myOrders.forEach(o => {
          allOrders.unshift({ ...o, user: currentUser, isMe: true, ts: o.ts || Date.now() });
      });

      // ยอดรวมนับเฉพาะแก้วที่ไม่ได้ถูกยกเลิก
      const activeTotal = allOrders.filter(o => o.status !== 'CANCELLED').length;
      document.getElementById('total-count').innerText = `${activeTotal} แก้ว`;

      if (allOrders.length === 0) {
        list.innerHTML = `<div class="p-8 text-center text-gray-400 font-bold">ยังไม่มีรายการสั่งซื้อ</div>`;
        return;
      }

      let newOrders = [];
      let oldOrders = [];

      allOrders.forEach(order => {
        const isNew = order.ts > lockedTimestamp;
        if (isNew) newOrders.push(order);
        else oldOrders.push(order);
      });

      newOrders.sort((a, b) => b.ts - a.ts);
      oldOrders.sort((a, b) => b.ts - a.ts);

      function renderOrderBlock(orders, title, icon, colorClass, borderTop) {
        if (orders.length === 0) return '';
        
        // นับยอดรวมสำหรับบล็อกนีเฉพาะที่ไม่ถูกยกเลิก
        const blockActiveCount = orders.filter(o => o.status !== 'CANCELLED').length;
        
        let html = `<div class="${colorClass} px-4 py-2 flex justify-between items-center text-xs font-black uppercase border-b-2 border-black ${borderTop ? 'border-t-[3px]' : ''}">
                      <span><i class="fa-solid ${icon} mr-1"></i> ${title}</span>
                      <span class="text-[10px] bg-white px-2 py-0.5 rounded-full border border-black">${blockActiveCount} แก้ว</span>
                    </div>`;
                    
        let grouped = {};
        orders.forEach(order => {
            let drinkKey = order.drinkId === 'custom' ? `custom_${order.drinkName.trim().toLowerCase()}` : order.drinkId;
            // แยกกลุ่มด้วย Status เพื่อไม่ให้แก้วปกติและแก้วที่ถูกยกเลิกไปรวมกัน
            let key = `${drinkKey}_${order.type}_${order.sweetness}_${order.note || ''}_${order.status || 'ACTIVE'}`;
            
            if (!grouped[key]) {
                grouped[key] = {
                    drinkName: order.drinkName,
                    type: order.type,
                    sweetness: order.sweetness,
                    note: order.note,
                    status: order.status || 'ACTIVE',
                    orders: []
                };
            }
            grouped[key].orders.push(order);
        });

        const groupedArray = Object.values(grouped);
        
        groupedArray.forEach((group, index) => {
          const isMe = group.orders.some(o => o.isMe);
          const isCancelled = group.status === 'CANCELLED';
          
          const bgClass = isCancelled ? 'bg-red-50' : (isMe ? 'bg-[#fef08a]' : 'bg-white');
          
          let typeColor = 'bg-gray-200 text-gray-800';
          if (group.type === 'ร้อน') typeColor = 'bg-red-100 text-red-800 border-red-300';
          else if (group.type === 'เย็น') typeColor = 'bg-blue-100 text-blue-800 border-blue-300';
          else if (group.type === 'ปั่น') typeColor = 'bg-purple-100 text-purple-800 border-purple-300';

          const isLast = index === groupedArray.length - 1;
          const borderClass = isLast ? '' : 'border-b-2 border-gray-200';

          let userCounts = {};
          group.orders.forEach(o => {
             let uKey = o.user.id || o.user.name;
             if(!userCounts[uKey]) {
                 userCounts[uKey] = { user: o.user, count: 0, isMe: o.isMe, ts: o.ts };
             }
             userCounts[uKey].count++;
             if(o.ts > userCounts[uKey].ts) userCounts[uKey].ts = o.ts;
          });

          const usersHtml = Object.values(userCounts).map(uc => {
             const userBadge = uc.isMe ? '<span class="text-[9px] bg-black text-white px-1.5 py-0.5 rounded ml-1 shadow-[1px_1px_0_0_#fff]">ฉัน</span>' : '';
             const isNew = uc.ts > lockedTimestamp;
             const newBadge = (isNew && !isCancelled) ? '<span class="bg-[#f87171] text-white text-[9px] font-black px-1 py-0.5 rounded ml-1 border border-black shadow-[1px_1px_0_0_#000] animate-pulse">NEW</span>' : '';
             const lockedBadge = (!isNew && !isCancelled) ? '<i class="fa-solid fa-lock text-[8px] text-gray-400 ml-1" title="สั่งร้านแล้ว"></i>' : '';
             
             return `
               <div class="flex items-center gap-2 ${isCancelled ? 'opacity-50 grayscale' : ''}">
                 <div class="w-8 h-8 rounded-full border-2 border-black flex items-center justify-center shrink-0 ${uc.user.color} shadow-[1px_1px_0_0_#000]">
                   <i class="fa-solid ${uc.user.icon} text-xs"></i>
                 </div>
                 <div class="flex flex-col overflow-hidden">
                   <div class="font-bold text-xs truncate leading-tight flex items-center ${isCancelled ? 'line-through text-red-600' : ''}">${uc.user.name} ${userBadge} ${newBadge} ${lockedBadge}</div>
                   <div class="text-[10px] font-bold text-gray-500">${uc.count} แก้ว</div>
                 </div>
               </div>
             `;
          }).join('<div class="h-1"></div>');

          const displaySweetness = formatSweetness(group.sweetness);
          const strikeClass = isCancelled ? 'line-through text-red-500 opacity-60' : '';
          const cancelBadge = isCancelled ? '<span class="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded border border-black shadow-[1px_1px_0_0_#000] ml-2">ยกเลิกแล้ว</span>' : '';

          html += `
            <div class="${bgClass} p-4 flex items-center justify-between gap-4 ${borderClass}">
              <!-- ฝั่งซ้าย: คนสั่ง -->
              <div class="flex flex-col gap-1 w-1/3 min-w-[120px]">
                ${usersHtml}
              </div>
              
              <!-- ฝั่งขวา: รายละเอียดน้ำและจำนวนรวม -->
              <div class="flex-1 border-l-2 border-gray-200 pl-4 flex items-center justify-between">
                <div class="flex-1 pr-2">
                  <div class="font-black text-sm mb-1 leading-tight flex items-center ${strikeClass}">${group.drinkName} ${cancelBadge}</div>
                  <div class="flex flex-wrap gap-1 mb-1 ${isCancelled ? 'opacity-50 grayscale' : ''}">
                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-black ${typeColor}">${group.type}</span>
                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-black bg-white">${displaySweetness}</span>
                  </div>
                  ${group.note ? `<div class="text-xs font-medium text-gray-500 ${isCancelled ? 'opacity-50 line-through' : ''}"><i class="fa-solid fa-comment-dots text-[10px]"></i> ${group.note}</div>` : ''}
                </div>
                
                <div class="w-10 h-10 ${isCancelled ? 'bg-red-200 text-red-500 line-through' : 'bg-[var(--brand-color)] text-white'} border-2 border-black rounded-xl flex items-center justify-center font-black text-xl shadow-[2px_2px_0_0_#000] shrink-0">
                  ${group.orders.length}
                </div>
              </div>
            </div>
          `;
        });
        return html;
      }

      if (newOrders.length > 0) {
        list.innerHTML += `
          <div class="bg-[#fef08a] p-4 border-b-[3px] border-black flex flex-col gap-3">
            <span class="font-black text-sm text-red-600 flex items-center"><i class="fa-solid fa-bell animate-pulse mr-2"></i> มีการสั่งซื้อใหม่ (ยังไม่ได้ล็อกออเดอร์)</span>
            <button onclick="lockOrders()" class="neo-btn neo-btn-success w-full py-3 shadow-[2px_2px_0_0_#000]">
              <i class="fa-solid fa-lock mr-2"></i> ฉันจะไปสั่งร้าน (ล็อกออเดอร์ทั้งหมด)
            </button>
            <p class="text-[10px] font-medium text-gray-600 text-center leading-tight">เมื่อกดยืนยัน รายการที่ถูกยกเลิกขีดฆ่าทั้งหมดจะถูกลบออกถาวร และออเดอร์จะถูกล็อกไม่ให้แก้ไขได้อีก</p>
          </div>
        `;
        list.innerHTML += renderOrderBlock(newOrders, '✨ รายการมาใหม่', 'fa-sparkles text-red-500', 'bg-[#fef08a]', false);
        list.innerHTML += renderOrderBlock(oldOrders, '📋 รายการก่อนหน้า (สั่งร้านแล้ว)', 'fa-lock text-gray-500', 'bg-gray-200 text-gray-500', true);
      } else {
        list.innerHTML += renderOrderBlock(allOrders, '📋 รายการออเดอร์ทั้งหมด (สั่งร้านแล้ว)', 'fa-lock text-gray-500', 'bg-gray-200 text-gray-800', false);
      }

      // ปุ่มเคลียร์ออเดอร์จะแสดงก็ต่อเมื่อมี "ออเดอร์ที่ถูกสั่งร้านแล้ว (Locked)" เท่านั้น
      const hasLockedOrders = oldOrders.some(o => o.status !== 'CANCELLED');
      if (hasLockedOrders) {
        list.innerHTML += `
          <div class="p-4 mt-2 mb-2 border-t-[3px] border-black">
            <button onclick="clearAllOrders()" class="neo-btn neo-btn-danger w-full py-4 shadow-[2px_2px_0_0_#000] text-red-900 border-red-900 bg-[#fca5a5] hover:bg-red-400">
              <i class="fa-solid fa-flag-checkered mr-2"></i> ได้รับเครื่องดื่มแล้ว (เคลียร์ออเดอร์ทั้งหมด)
            </button>
          </div>
        `;
      }
    }

    function updateBadgeCount() {
       let allOrders = getAllOrders();
       // นับเฉพาะที่มีการสร้างใหม่ และไม่ใช่การกดยกเลิก
       const newCount = allOrders.filter(o => o.ts > lockedTimestamp && o.status !== 'CANCELLED').length;
       const badge = document.getElementById('summary-badge');
       
       if (newCount > 0) {
          badge.innerText = newCount > 99 ? '99+' : newCount;
          badge.classList.remove('hidden');
          badge.classList.add('animate-bounce');
          setTimeout(() => badge.classList.remove('animate-bounce'), 1000);
       } else {
          badge.classList.add('hidden');
       }
    }

    window.lockOrders = function() {
        showConfirm('ยืนยันรับหน้าที่สั่งร้าน', 'คุณแน่ใจใช่ไหมที่จะเป็นคนไปสั่งร้าน?\nหากกดยืนยัน รายการที่ยกเลิกจะถูกลบทิ้งถาวร และออเดอร์ปัจจุบันจะถูกล็อก ไม่ให้เพื่อนแก้ไขได้อีก', async () => {
           const now = Date.now();
           lockedTimestamp = now;
           localStorage.setItem('happy_cup_locked_ts', lockedTimestamp);
           
           if (GAS_WEB_APP_URL !== "ใส่_URL_WEB_APP_ของคุณที่นี่") {
               showLoading(true, "กำลังล็อกออเดอร์ส่วนกลาง...");
               try {
                   await fetch(GAS_WEB_APP_URL, {
                       method: 'POST',
                       body: JSON.stringify({ action: 'lock' }),
                       headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                   });
                   // รีเฟรชข้อมูลใหม่หลังจากลบทิ้งถาวรในเซิร์ฟเวอร์เสร็จ
                   await loadOrdersFromSheet(true);
               } catch(e) {
                   showNotification('เกิดข้อผิดพลาด', 'ล็อกออเดอร์ในระบบไม่สำเร็จ', 'error');
               }
               showLoading(false);
           } else {
               // จำลองการ Hard Delete หากไม่ต่อเน็ต
               myOrders = myOrders.filter(o => o.status !== 'CANCELLED');
               localStorage.setItem('amazon_my_orders', JSON.stringify(myOrders));
               renderSummary();
               updateBadgeCount();
               renderMyOrdersBanner();
           }
        });
    }

    // ฟังก์ชันใหม่: ล้างข้อมูลออเดอร์ทั้งหมด
    window.clearAllOrders = function() {
        showConfirm('ยืนยันได้รับเครื่องดื่ม', 'คุณได้รับเครื่องดื่มครบถ้วนแล้วใช่หรือไม่?\nการกดปุ่มนี้จะล้างข้อมูลออเดอร์ทั้งหมดในระบบเพื่อเริ่มรอบใหม่', async () => {
           if (GAS_WEB_APP_URL !== "ใส่_URL_WEB_APP_ของคุณที่นี่") {
               showLoading(true, "กำลังล้างข้อมูลออเดอร์ทั้งหมด...");
               try {
                   await fetch(GAS_WEB_APP_URL, {
                       method: 'POST',
                       body: JSON.stringify({ action: 'clearAll' }),
                       headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                   });
                   
                   // รีเซ็ตข้อมูลในเครื่อง
                   lockedTimestamp = 0;
                   localStorage.setItem('happy_cup_locked_ts', 0);
                   myOrders = [];
                   localStorage.setItem('amazon_my_orders', JSON.stringify([]));
                   
                   await loadOrdersFromSheet(true);
                   showNotification('เรียบร้อย', 'เคลียร์ออเดอร์สำเร็จ พร้อมเริ่มรอบใหม่แล้ว', 'success');
               } catch(e) {
                   showNotification('เกิดข้อผิดพลาด', 'เคลียร์ออเดอร์ส่วนกลางไม่สำเร็จ', 'error');
               }
               showLoading(false);
           } else {
               lockedTimestamp = 0;
               localStorage.setItem('happy_cup_locked_ts', 0);
               myOrders = [];
               localStorage.setItem('amazon_my_orders', JSON.stringify([]));
               teamOrders = [];
               renderSummary();
               updateBadgeCount();
               renderMyOrdersBanner();
               renderMenu(document.getElementById('search-input').value);
           }
        });
    }

    function openOrderModal(drinkId) {
      document.getElementById('input-drink-id').value = drinkId;
      const nameText = document.getElementById('modal-drink-name');
      const nameInput = document.getElementById('modal-drink-name-input');
      const cupCountText = document.getElementById('modal-cup-count-info');
      
      const optHot = document.getElementById('type-hot');
      const optIced = document.getElementById('type-iced');
      const optFrappe = document.getElementById('type-frappe');

      document.getElementById('input-sweetness').value = '100%';
      document.getElementById('input-note').value = '';
      document.getElementById('input-quantity').value = 1;
      document.getElementById('input-quantity-display').innerText = '1';

      if (drinkId === 'custom') {
        nameText.classList.add('hidden');
        nameInput.classList.remove('hidden');
        nameInput.value = '';
        if(cupCountText) cupCountText.classList.add('hidden');
        
        // ถ้าพิมพ์เอง ให้กดได้ทุกปุ่ม และติ๊กเย็นเป็นค่าเริ่มต้น
        optHot.disabled = false; optIced.disabled = false; optFrappe.disabled = false;
        optIced.checked = true;
      } else {
        const drink = MENU_ITEMS.find(m => m.id === drinkId);
        if (!drink) return;
        nameText.classList.remove('hidden');
        nameInput.classList.add('hidden');
        nameText.innerText = drink.name;
        document.getElementById('input-drink-name').value = drink.name;
        
        // ปิดการกด (Disable) ปุ่มที่เมนูนั้นไม่มี
        optHot.disabled = !drink.opts.h;
        optIced.disabled = !drink.opts.i;
        optFrappe.disabled = !drink.opts.f;

        // เลือกปุ่มให้ล่วงหน้า (พยายามเลือก เย็น -> ร้อน -> ปั่น ตามลำดับที่มีขาย)
        if (drink.opts.i) optIced.checked = true;
        else if (drink.opts.h) optHot.checked = true;
        else if (drink.opts.f) optFrappe.checked = true;
        
        if(cupCountText) {
          let allOrders = getAllOrders();
          let orderedCount = allOrders.filter(o => o.drinkId === drinkId && o.status !== 'CANCELLED').length;
          if (orderedCount > 0) {
             cupCountText.innerHTML = `<i class="fa-solid fa-circle-info"></i> เมนูนี้มีคนสั่งไปแล้ว ${orderedCount} แก้ว (ของคุณจะเริ่มที่แก้วที่ ${orderedCount + 1})`;
             cupCountText.classList.remove('hidden');
          } else {
             cupCountText.classList.add('hidden');
          }
        }
      }

      const m = document.getElementById('order-modal');
      const c = document.getElementById('order-modal-content');
      m.classList.remove('hidden');
      void m.offsetWidth;
      m.classList.remove('opacity-0', 'pointer-events-none');
      
      // เปลี่ยนเป็นคำสั่งนี้คำสั่งเดียว
      c.classList.remove('scale-95');
      
      if(drinkId === 'custom') setTimeout(() => nameInput.focus(), 300);
      // จำลองการสร้างประวัติหน้าเว็บ เพื่อหลอกให้มือถือรู้ว่ามีการเปิดหน้าใหม่
      history.pushState({ modal: 'order' }, '', window.location.href);
    }

    function closeOrderModal() {
      // เช็คว่ามีประวัติการเปิด Modal ค้างอยู่หรือไม่ ถ้ามีให้สั่งย้อนกลับ (มันจะไปเรียกการปิดผ่าน popstate เอง)
      if (history.state && history.state.modal === 'order') {
        history.back(); 
      } else {
        // ถ้าไม่มีประวัติ (เช่น เผลอปิดเอง) ก็ให้ปิดหน้าต่างไปตามปกติ
        const m = document.getElementById('order-modal');
        const c = document.getElementById('order-modal-content');
        m.classList.add('opacity-0', 'pointer-events-none');
        c.classList.add('scale-95');
        setTimeout(() => m.classList.add('hidden'), 300);
      }
    }

    async function submitOrder() {
      const drinkId = document.getElementById('input-drink-id').value;
      let drinkName = "";
      
      if(drinkId === 'custom') {
         drinkName = document.getElementById('modal-drink-name-input').value.trim();
         if(!drinkName) return showNotification('ข้อมูลไม่ครบ', 'กรุณาระบุชื่อเมนูที่ต้องการ', 'error');
      } else {
         drinkName = document.getElementById('input-drink-name').value;
      }

      const type = document.querySelector('input[name="drink_type"]:checked').value;
      const sweetness = document.getElementById('input-sweetness').value;
      const note = document.getElementById('input-note').value.trim();
      const quantity = parseInt(document.getElementById('input-quantity').value, 10) || 1;

      const newOrders = [];
      const timestamp = Date.now();
      
      for (let i = 0; i < quantity; i++) {
        newOrders.push({
          id: 'o_' + timestamp + '_' + i + Math.floor(Math.random()*1000),
          drinkId,
          drinkName,
          type,
          sweetness,
          note,
          status: 'ACTIVE',
          ts: timestamp + i 
        });
      }

      myOrders.push(...newOrders);
      localStorage.setItem('amazon_my_orders', JSON.stringify(myOrders));
      
      closeOrderModal();
      renderMenu(document.getElementById('search-input').value);
      renderMyOrdersBanner();

      if (GAS_WEB_APP_URL !== "ใส่_URL_WEB_APP_ของคุณที่นี่") {
        showLoading(true, "กำลังส่งออเดอร์...");
        try {
          const promises = newOrders.map(order => {
            const payload = {
              action: 'order',
              orderId: order.id,
              userId: currentUser.id,
              userName: currentUser.name,
              userIcon: currentUser.icon,
              userColor: currentUser.color,
              drinkId: order.drinkId,
              drinkName: order.drinkName,
              type: order.type,
              sweetness: order.sweetness,
              note: order.note
            };

            return fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              body: JSON.stringify(payload),
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
          });

          await Promise.all(promises);
          
          loadOrdersFromSheet(); 
          showNotification('สั่งสำเร็จ!', `บันทึกออเดอร์จำนวน ${quantity} แก้ว เข้าสู่ระบบแล้ว`, 'success');
        } catch(e) {
          showNotification('มีบางอย่างผิดพลาด', 'บันทึกลงชีทไม่สำเร็จ แต่ออเดอร์ถูกจำไว้ในเครื่องแล้ว', 'error');
        }
        showLoading(false);
      } else {
        showNotification('สั่งสำเร็จ!', `บันทึกออเดอร์ในเครื่องจำนวน ${quantity} แก้ว (ยังไม่ได้เชื่อมต่อ Google Sheet)`, 'success');
        if(isViewingSummary) renderSummary(); 
      }
    }

    function cancelMyOrderGroup(idsString) {
      const ids = idsString.split(',');
      let message = ids.length > 1 
          ? `คุณแน่ใจหรือไม่ว่าต้องการยกเลิกออเดอร์กลุ่มนี้ (จำนวน ${ids.length} แก้ว)?\n(ออเดอร์จะแสดงผลขีดฆ่าให้เพื่อนทราบก่อนลบทิ้งจริง)` 
          : 'คุณแน่ใจหรือไม่ว่าต้องการยกเลิกออเดอร์แก้วนี้?\n(ออเดอร์จะแสดงผลขีดฆ่าให้เพื่อนทราบก่อนลบทิ้งจริง)';

      showConfirm('ยกเลิกออเดอร์', message, async () => {
        // อัปเดตสถานะในเครื่องให้เป็นขีดฆ่าชั่วคราว
        myOrders = myOrders.map(o => {
           if(ids.includes(o.id)) return { ...o, status: 'CANCELLED' };
           return o;
        });
        localStorage.setItem('amazon_my_orders', JSON.stringify(myOrders));
        
        renderMenu(document.getElementById('search-input').value);
        renderMyOrdersBanner();

        if (GAS_WEB_APP_URL !== "ใส่_URL_WEB_APP_ของคุณที่นี่") {
          showLoading(true, "กำลังยกเลิก...");
          try {
             // ส่งคำขอยกเลิกแบบ Soft Delete ไปยังเซิร์ฟเวอร์
             const promises = ids.map(id => fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'cancel', orderId: id }),
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }));
            
            await Promise.all(promises);
            loadOrdersFromSheet();
            showNotification('ยกเลิกสำเร็จ', 'สถานะถูกปรับเป็นขีดฆ่ายกเลิกเรียบร้อย', 'success');
          } catch(e) {
            showNotification('เกิดข้อผิดพลาด', 'ไม่สามารถส่งข้อมูลไปยกเลิกระบบกลางได้', 'error');
          }
          showLoading(false);
        } else {
          if(isViewingSummary) renderSummary();
        }
      });
    }

    function openProfileModal() {
      document.getElementById('edit-profile-name').value = currentUser.name;
      const bigAv = document.getElementById('profile-big-avatar');
      bigAv.className = `w-20 h-20 rounded-full border-4 border-black flex items-center justify-center text-4xl shadow-[4px_4px_0_0_#000] ${currentUser.color}`;
      bigAv.innerHTML = `<i class="fa-solid ${currentUser.icon}"></i>`;
      const m = document.getElementById('profile-modal'), c = document.getElementById('profile-modal-content');
      m.classList.remove('hidden'); void m.offsetWidth; m.classList.remove('opacity-0', 'pointer-events-none'); c.classList.remove('scale-95');
    }

    function closeProfileModal() {
      const m = document.getElementById('profile-modal'), c = document.getElementById('profile-modal-content');
      m.classList.add('opacity-0', 'pointer-events-none'); c.classList.add('scale-95');
      setTimeout(() => m.classList.add('hidden'), 200);
    }

    async function saveProfile() {
      const newName = document.getElementById('edit-profile-name').value.trim();
      if (!newName) return showNotification('ผิดพลาด', 'กรุณาใส่ชื่อของคุณ', 'error');
      
      currentUser.name = newName;
      localStorage.setItem('amazon_user', JSON.stringify(currentUser));
      updateHeader();
      closeProfileModal();
      
      if (myOrders.length > 0 && GAS_WEB_APP_URL !== "ใส่_URL_WEB_APP_ของคุณที่นี่") {
        showLoading(true, "อัปเดตชื่อในระบบ...");
        try {
          // เปลี่ยนจากการส่ง action: 'order' (ที่ทำให้เกิดการเบิ้ล) เป็น action: 'updateProfile' เพื่อแก้ข้อมูลเดิม
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ 
              action: 'updateProfile', 
              userId: currentUser.id, 
              userName: currentUser.name, 
              userIcon: currentUser.icon, 
              userColor: currentUser.color 
            }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          });
          await loadOrdersFromSheet();
        } catch (error) {
          console.error(error);
          showNotification('เกิดข้อผิดพลาด', 'อัปเดตชื่อบนระบบส่วนกลางไม่สำเร็จ', 'error');
        }
        showLoading(false);
      } else {
        if(isViewingSummary) renderSummary(); 
      }
    }

    function switchTab(tab) {
      const vMenu = document.getElementById('view-menu'), vSummary = document.getElementById('view-summary');
      const tMenu = document.getElementById('tab-menu'), tSummary = document.getElementById('tab-summary');

      if (tab === 'menu') {
        isViewingSummary = false;
        vMenu.classList.remove('hidden'); vSummary.classList.add('hidden');
        tMenu.className = 'flex-1 py-3 font-black text-center border-r-2 border-black bg-[#fde047] transition';
        tSummary.className = 'relative flex-1 py-3 font-bold text-center text-gray-500 hover:bg-gray-100 transition';
        renderMenu(document.getElementById('search-input').value);
      } else {
        isViewingSummary = true;
        vMenu.classList.add('hidden'); vSummary.classList.remove('hidden');
        tSummary.className = 'relative flex-1 py-3 font-black text-center border-l-2 border-black bg-[#fde047] transition';
        tMenu.className = 'flex-1 py-3 font-bold text-center text-gray-500 hover:bg-gray-100 transition';
        renderSummary(); 
      }
    }

    function showNotification(title, message, type = 'info') {
      const m = document.getElementById('custom-modal'), c = document.getElementById('custom-modal-content'), i = document.getElementById('custom-modal-icon');
      document.getElementById('custom-modal-title').innerText = title; document.getElementById('custom-modal-message').innerText = message;
      if (type === 'success') i.innerHTML = '<div class="inline-block bg-[#86efac] border-[3px] border-black rounded-full w-16 h-16 flex items-center justify-center mx-auto shadow-[4px_4px_0_0_#000]"><i class="fa-solid fa-check text-black"></i></div>';
      else if (type === 'error') i.innerHTML = '<div class="inline-block bg-[#fca5a5] border-[3px] border-black rounded-full w-16 h-16 flex items-center justify-center mx-auto shadow-[4px_4px_0_0_#000]"><i class="fa-solid fa-exclamation text-black"></i></div>';
      else i.innerHTML = '<div class="inline-block bg-[#93c5fd] border-[3px] border-black rounded-full w-16 h-16 flex items-center justify-center mx-auto shadow-[4px_4px_0_0_#000]"><i class="fa-solid fa-info text-black"></i></div>';
      document.getElementById('custom-modal-actions').innerHTML = `<button onclick="closeCustomModal()" class="neo-btn w-full py-3 bg-black text-white">ตกลง</button>`;
      m.classList.remove('hidden'); void m.offsetWidth; m.classList.remove('opacity-0', 'pointer-events-none'); c.classList.remove('scale-95');
    }

    function showConfirm(title, message, onConfirm) {
      const m = document.getElementById('custom-modal'), c = document.getElementById('custom-modal-content');
      document.getElementById('custom-modal-title').innerText = title; document.getElementById('custom-modal-message').innerText = message;
      document.getElementById('custom-modal-icon').innerHTML = '<div class="inline-block bg-[#fca5a5] border-[3px] border-black rounded-full w-16 h-16 flex items-center justify-center mx-auto shadow-[4px_4px_0_0_#000]"><i class="fa-solid fa-question text-black"></i></div>';
      document.getElementById('custom-modal-actions').innerHTML = `<button onclick="closeCustomModal()" class="neo-btn w-1/2 py-3">ยกเลิก</button><button id="btn-confirm-yes" class="neo-btn neo-btn-danger w-1/2 py-3">ยืนยัน</button>`;
      document.getElementById('btn-confirm-yes').onclick = () => { closeCustomModal(); if(onConfirm) onConfirm(); };
      m.classList.remove('hidden'); void m.offsetWidth; m.classList.remove('opacity-0', 'pointer-events-none'); c.classList.remove('scale-95');
    }

    window.closeCustomModal = () => {
      const m = document.getElementById('custom-modal'), c = document.getElementById('custom-modal-content');
      m.classList.add('opacity-0', 'pointer-events-none'); c.classList.add('scale-95'); setTimeout(() => m.classList.add('hidden'), 200);
    };

  </script>
</body>
</html>
