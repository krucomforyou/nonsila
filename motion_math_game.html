<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมคณิตศาสตร์ ตรวจจับการเคลื่อนไหว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #1a202c;
            color: white;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        /* UI Overlays */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            flex-direction: column;
        }
        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 50;
        }
        .hidden { display: none !important; }
        
        /* Video element for processing (hidden) */
        #webcamVideo {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="startScreen">
        <h1 class="text-6xl font-bold text-yellow-400 mb-4 drop-shadow-lg text-center">คณิตศาสตร์ทะลุจอ!</h1>
        <p class="text-xl mb-8 text-center max-w-2xl">อนุญาตให้ใช้กล้อง Webcam<br>จากนั้นใช้มือของคุณขยับไปที่วงกลมคำตอบบนหน้าจอเพื่อเลือกคำตอบที่ถูกต้อง</p>
        <button id="startBtn" class="px-8 py-4 bg-blue-500 hover:bg-blue-600 text-white rounded-full text-3xl font-bold shadow-lg transition transform hover:scale-105 pointer-events-auto cursor-pointer">
            เริ่มเกมเลย!
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="hidden">
        <h1 class="text-7xl font-bold text-red-500 mb-4 drop-shadow-lg">จบเกม!</h1>
        <p class="text-3xl mb-4">คะแนนของคุณ: <span id="finalScore" class="text-yellow-400 font-bold">0</span></p>
        <button id="restartBtn" class="mt-8 px-8 py-4 bg-green-500 hover:bg-green-600 text-white rounded-full text-3xl font-bold shadow-lg transition transform hover:scale-105 pointer-events-auto cursor-pointer">
            เล่นอีกครั้ง
        </button>
    </div>

    <!-- Hidden Video Element for Webcam -->
    <video id="webcamVideo" autoplay playsinline></video>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const video = document.getElementById('webcamVideo');
        
        // UI Elements
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScoreSpan = document.getElementById('finalScore');

        // Game State
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let lives = 5;
        let timeLeft = 60; // 1 minute
        let lastTime = 0;
        let timerInterval;

        // Question State
        let currentQuestion = "";
        let correctAnswer = 0;
        let options = {
            left: { value: 0, x: 0, y: 0, radius: 80, progress: 0 },
            right: { value: 0, x: 0, y: 0, radius: 80, progress: 0 }
        };
        let isCorrectLeft = true;
        let feedbackTimer = 0;
        let feedbackColor = "";

        // Motion Detection State
        let prevFrameData = null;
        const MOTION_THRESHOLD = 30; // ความไวของการตรวจจับพิกเซลที่เปลี่ยนไป (0-255)
        const TRIGGER_SCORE = 1500;  // จำนวนพิกเซลที่ต้องขยับเพื่อเริ่มนับ progress
        const PROGRESS_SPEED = 3;    // ความเร็วในการชาร์จเพื่อตอบ (หลอดเต็ม = ตอบ)

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Update Option Positions based on screen size
            options.left.x = canvas.width * 0.2;
            options.left.y = canvas.height * 0.6;
            
            options.right.x = canvas.width * 0.8;
            options.right.y = canvas.height * 0.6;

            // Adjust radius based on screen size
            const baseRadius = Math.min(canvas.width, canvas.height) * 0.12;
            options.left.radius = baseRadius;
            options.right.radius = baseRadius;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Initialize Webcam
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                video.srcObject = stream;
                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });
            } catch (err) {
                console.error("Camera error:", err);
                alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้งานกล้องเพื่อเล่นเกมนี้");
            }
        }

        // Generate Math Question
        function generateQuestion() {
            const operations = ['+', '-', 'x'];
            const op = operations[Math.floor(Math.random() * operations.length)];
            let num1, num2;

            if (op === '+') {
                num1 = Math.floor(Math.random() * 50) + 1;
                num2 = Math.floor(Math.random() * 50) + 1;
                correctAnswer = num1 + num2;
            } else if (op === '-') {
                num1 = Math.floor(Math.random() * 50) + 20;
                num2 = Math.floor(Math.random() * num1);
                correctAnswer = num1 - num2;
            } else {
                num1 = Math.floor(Math.random() * 12) + 2;
                num2 = Math.floor(Math.random() * 9) + 2;
                correctAnswer = num1 * num2;
            }

            currentQuestion = `${num1} ${op} ${num2} = ?`;

            // Generate wrong answer (close to correct answer)
            let wrongAnswer = correctAnswer + (Math.floor(Math.random() * 10) - 5);
            if (wrongAnswer === correctAnswer) wrongAnswer += 1;
            if (wrongAnswer < 0) wrongAnswer = 0;

            // Randomize position
            isCorrectLeft = Math.random() > 0.5;
            if (isCorrectLeft) {
                options.left.value = correctAnswer;
                options.right.value = wrongAnswer;
            } else {
                options.left.value = wrongAnswer;
                options.right.value = correctAnswer;
            }

            // Reset progress
            options.left.progress = 0;
            options.right.progress = 0;
        }

        // Motion Detection Logic
        function checkMotion() {
            if (gameState !== 'playing' || feedbackTimer > 0) return;

            // Draw current frame to canvas silently to get image data
            // We use a small offscreen canvas approach for performance
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = video.videoWidth;
            offscreenCanvas.height = video.videoHeight;
            const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
            
            // Mirror video for natural interaction
            offscreenCtx.translate(offscreenCanvas.width, 0);
            offscreenCtx.scale(-1, 1);
            offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
            
            const currentFrameData = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);

            if (prevFrameData) {
                // Map canvas coordinates to video coordinates
                const scaleX = offscreenCanvas.width / canvas.width;
                const scaleY = offscreenCanvas.height / canvas.height;

                checkOptionMotion('left', options.left, currentFrameData, prevFrameData, scaleX, scaleY, offscreenCanvas.width);
                checkOptionMotion('right', options.right, currentFrameData, prevFrameData, scaleX, scaleY, offscreenCanvas.width);
            }

            prevFrameData = currentFrameData;
        }

        function checkOptionMotion(side, option, currData, prevData, scaleX, scaleY, videoWidth) {
            // Define bounding box for the option in video coordinates
            const vX = Math.floor((option.x - option.radius) * scaleX);
            const vY = Math.floor((option.y - option.radius) * scaleY);
            const vW = Math.floor((option.radius * 2) * scaleX);
            const vH = Math.floor((option.radius * 2) * scaleY);

            let motionPixels = 0;

            // Scan pixels inside the bounding box
            for (let y = vY; y < vY + vH; y += 4) { // skip pixels for performance
                for (let x = vX; x < vX + vW; x += 4) {
                    // Bounds check
                    if (x < 0 || y < 0 || x >= videoWidth || y >= prevData.height) continue;

                    const i = (y * videoWidth + x) * 4;
                    
                    // Calculate pixel difference (Grayscale approximation)
                    const rDiff = Math.abs(currData.data[i] - prevData.data[i]);
                    const gDiff = Math.abs(currData.data[i+1] - prevData.data[i+1]);
                    const bDiff = Math.abs(currData.data[i+2] - prevData.data[i+2]);
                    
                    const avgDiff = (rDiff + gDiff + bDiff) / 3;

                    if (avgDiff > MOTION_THRESHOLD) {
                        motionPixels++;
                    }
                }
            }

            // Update Progress based on motion
            if (motionPixels > TRIGGER_SCORE / 16) { // Adjusted for skipping pixels
                option.progress += PROGRESS_SPEED;
                if (option.progress >= 100) {
                    handleAnswer(side);
                }
            } else {
                option.progress = Math.max(0, option.progress - (PROGRESS_SPEED * 2)); // Decay fast
            }
        }

        function handleAnswer(side) {
            const isCorrect = (side === 'left' && isCorrectLeft) || (side === 'right' && !isCorrectLeft);
            
            if (isCorrect) {
                score++;
                feedbackColor = "rgba(34, 197, 94, 0.5)"; // Green flash
            } else {
                lives--;
                feedbackColor = "rgba(239, 68, 68, 0.5)"; // Red flash
                if (lives <= 0) {
                    endGame();
                    return;
                }
            }

            feedbackTimer = 30; // frames for flash effect
            options.left.progress = 0;
            options.right.progress = 0;
            generateQuestion();
        }

        function drawHeart(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size, size);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-1, -1, -2, 1, 0, 2.5);
            ctx.bezierCurveTo(2, 1, 1, -1, 0, 0);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.restore();
        }

        // Main Render Loop
        function draw(timestamp) {
            if (gameState !== 'playing') return;

            // 1. Draw Video Background (Mirrored)
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // Check motion every frame
            checkMotion();

            // 2. Draw UI Background Bar
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, 80);

            // 3. Draw Score & Time
            ctx.fillStyle = 'white';
            ctx.font = '24px Kanit';
            ctx.textAlign = 'left';
            ctx.fillText(`คะแนน: ${score}`, 30, 35);
            ctx.fillText(`เวลาเหลือ: ${timeLeft} วินาที`, 30, 65);

            // 4. Draw Lives (Hearts)
            const rightPadding = canvas.width - 200;
            for(let i=0; i<5; i++) {
                if (i < lives) {
                    drawHeart(ctx, rightPadding + (i * 35), 40, 10);
                } else {
                    // Empty heart
                    ctx.save();
                    ctx.translate(rightPadding + (i * 35), 40);
                    ctx.scale(10, 10);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-1, -1, -2, 1, 0, 2.5);
                    ctx.bezierCurveTo(2, 1, 1, -1, 0, 0);
                    ctx.fillStyle = '#4b5563';
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 5. Draw Question
            ctx.fillStyle = '#facc15'; // Yellow
            ctx.font = 'bold 50px Kanit';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(currentQuestion, canvas.width / 2, 40);

            // 6. Draw Options (Circles)
            [options.left, options.right].forEach(opt => {
                // Outer glow / Progress ring
                if (opt.progress > 0) {
                    ctx.beginPath();
                    ctx.arc(opt.x, opt.y, opt.radius + 10, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * (opt.progress/100)));
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 15;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Main Circle
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, opt.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(14, 165, 233, 0.8)'; // Sky blue
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'white';
                ctx.stroke();

                // Text
                ctx.fillStyle = 'white';
                ctx.font = `bold ${opt.radius * 0.7}px Kanit`;
                ctx.fillText(opt.value, opt.x, opt.y + (opt.radius * 0.1));
            });

            // 7. Draw Feedback Flash
            if (feedbackTimer > 0) {
                ctx.fillStyle = feedbackColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                feedbackTimer--;
            }

            requestAnimationFrame(draw);
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            score = 0;
            lives = 5;
            timeLeft = 60;
            prevFrameData = null;
            
            generateQuestion();
            gameState = 'playing';
            
            // Start Timer
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'playing') {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);

            requestAnimationFrame(draw);
        }

        function endGame() {
            gameState = 'gameover';
            clearInterval(timerInterval);
            finalScoreSpan.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        // Event Listeners for Buttons
        startBtn.addEventListener('click', async () => {
            startBtn.innerText = "กำลังเปิดกล้อง...";
            await initCamera();
            startGame();
        });

        restartBtn.addEventListener('click', () => {
            startGame();
        });

    </script>
</body>
</html>
