<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อนักเรียน ปพ.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .radio-status:checked + label.status-ma { background-color: #10B981; color: white; border-color: #10B981; }
        .radio-status:checked + label.status-khad { background-color: #EF4444; color: white; border-color: #EF4444; }
        .radio-status:checked + label.status-puay { background-color: #F59E0B; color: white; border-color: #F59E0B; }
        .radio-status:checked + label.status-kij { background-color: #3B82F6; color: white; border-color: #3B82F6; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Top Navigation Tabs -->
    <div class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 sm:px-6">
            <div class="flex space-x-6 overflow-x-auto">
                <button onclick="switchTab('attendance')" id="tab-attendance" class="py-4 px-2 border-b-2 font-semibold text-blue-600 border-blue-600 whitespace-nowrap flex items-center gap-2 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    เช็คชื่อเข้าเรียน
                </button>
                <button onclick="switchTab('manage')" id="tab-manage" class="py-4 px-2 border-b-2 font-medium text-slate-500 border-transparent hover:text-slate-800 whitespace-nowrap flex items-center gap-2 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    ดูรายชื่อนักเรียน
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 mb-20">
        
        <!-- Loading State -->
        <div id="loading" class="text-center py-16 hidden">
            <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-slate-500 font-medium" id="loadingText">กำลังโหลดข้อมูลระบบ...</p>
        </div>

        <!-- ==================== SECTION: ATTENDANCE ==================== -->
        <div id="section-attendance">
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-slate-200">
                <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">ระบบเช็คชื่อนักเรียน</h1>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">วันที่เช็คชื่อ:</label>
                        <input type="date" id="checkDate" class="border border-slate-300 rounded-lg px-4 py-2 w-full focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ชั้นเรียน:</label>
                        <select id="subjectSelect" onchange="onClassSelect('attendance')" class="border border-slate-300 rounded-lg px-4 py-2 w-full bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">-- โหลดข้อมูลชั้นเรียน --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">คาบเรียน:</label>
                        <select id="periodSelect" class="border border-slate-300 rounded-lg px-4 py-2 w-full bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <optgroup label="คาบเดี่ยว"><option value="1">คาบ 1</option><option value="2">คาบ 2</option><option value="3">คาบ 3</option><option value="4">คาบ 4</option><option value="5">คาบ 5</option><option value="6">คาบ 6</option><option value="7">คาบ 7</option><option value="8">คาบ 8</option></optgroup>
                            <optgroup label="คาบคู่ (ติดกัน)"><option value="1-2">คาบ 1-2</option><option value="3-4">คาบ 3-4</option><option value="5-6">คาบ 5-6</option><option value="7-8">คาบ 7-8</option></optgroup>
                        </select>
                    </div>
                </div>
            </div>

            <div id="studentContainer" class="hidden">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 text-sm border-b border-slate-200">
                                    <th class="p-4 font-semibold w-16 text-center">ลำดับ</th>
                                    <th class="p-4 font-semibold">รหัสประจำตัว / ชื่อ-สกุล</th>
                                    <th class="p-4 font-semibold text-center min-w-[280px]">สถานะการมาเรียน</th>
                                </tr>
                            </thead>
                            <tbody id="studentList" class="divide-y divide-slate-100 text-sm sm:text-base"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== SECTION: MANAGE STUDENTS (VIEW ONLY) ==================== -->
        <div id="section-manage" class="hidden">
            
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 mb-6">
                <h2 class="text-xl font-bold text-indigo-900 mb-1">รายชื่อนักเรียน (ฐานข้อมูลหลัก)</h2>
                <p class="text-indigo-700 text-sm">ข้อมูลถูกดึงโดยตรงจาก Google Sheet ต้นฉบับแบบ Real-time</p>
                
                <div class="mt-4 w-full md:w-1/2">
                    <label class="block font-medium text-indigo-900 mb-1 text-sm">เลือกชั้นเรียนเพื่อเรียกดู:</label>
                    <select id="viewClassSelect" onchange="onClassSelect('manage')" class="border border-indigo-200 rounded-lg px-4 py-2 w-full bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-slate-800">
                        <option value="">-- โหลดข้อมูลชั้นเรียน --</option>
                    </select>
                </div>
            </div>

            <div id="manageStudentContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">จำนวนนักเรียน</h3>
                    <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold" id="manageTotalCount">0 คน</span>
                </div>
                <div class="overflow-x-auto max-h-[600px]">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-white shadow-sm z-10">
                            <tr class="text-slate-600 text-sm border-b border-slate-200">
                                <th class="p-4 font-semibold text-center w-20">ลำดับ</th>
                                <th class="p-4 font-semibold w-32">รหัสประจำตัว</th>
                                <th class="p-4 font-semibold">ชื่อ - สกุล</th>
                            </tr>
                        </thead>
                        <tbody id="manageStudentList" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- Bottom Bar (Only visible in Attendance Tab) -->
    <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] p-4 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="text-sm sm:text-base text-slate-600 font-medium hidden sm:block">
                นักเรียน <span id="totalCount" class="text-blue-600 font-bold">0</span> คน
            </div>
            <button id="saveBtn" onclick="saveData()" disabled class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-8 rounded-xl shadow-sm transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                บันทึกการเช็คชื่อ
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-4 right-4 z-50 transform transition-all duration-300 opacity-0 translate-y-[-100%] pointer-events-none">
        <div class="bg-green-600 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toastMsg" class="font-medium">สำเร็จ</span>
        </div>
    </div>

    <script>
        document.getElementById('checkDate').valueAsDate = new Date();
        let classList = []; 
        let currentStudents = []; 

        function switchTab(tab) {
            document.getElementById('section-attendance').classList.toggle('hidden', tab !== 'attendance');
            document.getElementById('section-manage').classList.toggle('hidden', tab !== 'manage');
            
            const actCls = 'py-4 px-2 border-b-2 font-semibold text-blue-600 border-blue-600 whitespace-nowrap flex items-center gap-2 transition-colors';
            const inactCls = 'py-4 px-2 border-b-2 font-medium text-slate-500 border-transparent hover:text-slate-800 whitespace-nowrap flex items-center gap-2 transition-colors';
            
            document.getElementById('tab-attendance').className = tab === 'attendance' ? actCls : inactCls;
            document.getElementById('tab-manage').className = tab === 'manage' ? actCls : inactCls;
            document.getElementById('bottom-bar').style.display = tab === 'attendance' ? 'block' : 'none';
        }

        function init() {
            setLoading(true, "กำลังโหลดข้อมูลชั้นเรียน...");
            
            if (typeof google !== 'undefined' && google.script) {
                // รันบน Google Apps Script
                google.script.run
                    .withSuccessHandler(setupClasses)
                    .withFailureHandler((err) => showError("ไม่สามารถดึงข้อมูลชั้นเรียนได้"))
                    .getStudentClasses();
            } else {
                // โหมด Preview บนเว็บ (จำลองชื่อชั้นเรียนตามภาพที่ให้มา)
                setTimeout(() => {
                    const mockClasses = ['ป.1-2569', 'ป.2-2569', 'ป.3-2569', 'ป.4/1-2569', 'ป.4/2-2569', 'ป.5/1-2569', 'ป.5/2-2569', 'ป.6-2569', 'อ.2-2569', 'อ.3-2569'];
                    setupClasses(mockClasses);
                }, 800);
            }
        }

        function setupClasses(classes) {
            setLoading(false);
            classList = classes || [];
            
            const attSelect = document.getElementById('subjectSelect');
            const viewSelect = document.getElementById('viewClassSelect');
            
            let options = '<option value="">-- เลือกชั้นเรียน --</option>';
            classList.forEach(c => {
                options += `<option value="${c}">${c}</option>`;
            });
            
            attSelect.innerHTML = options;
            viewSelect.innerHTML = options;
            
            // สร้างข้อความแนะนำ
            document.getElementById('studentContainer').classList.remove('hidden');
            document.getElementById('studentList').innerHTML = `<tr><td colspan="3" class="text-center p-8 text-slate-500">👈 กรุณาเลือก "ชั้นเรียน" ด้านบนเพื่อเริ่มเช็คชื่อ</td></tr>`;
        }

        function onClassSelect(context) {
            const isAttendance = context === 'attendance';
            const selectId = isAttendance ? 'subjectSelect' : 'viewClassSelect';
            const listId = isAttendance ? 'studentList' : 'manageStudentList';
            const containerId = isAttendance ? 'studentContainer' : 'manageStudentContainer';
            const className = document.getElementById(selectId).value;

            const tbody = document.getElementById(listId);
            const container = document.getElementById(containerId);

            if (!className) {
                if (isAttendance) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-slate-500">👈 กรุณาเลือก "ชั้นเรียน" ด้านบนเพื่อเริ่มเช็คชื่อ</td></tr>`;
                    document.getElementById('saveBtn').disabled = true;
                    document.getElementById('totalCount').innerText = "0";
                } else {
                    container.classList.add('hidden');
                }
                currentStudents = [];
                return;
            }

            // Sync dropdowns
            if (isAttendance) document.getElementById('viewClassSelect').value = className;
            else document.getElementById('subjectSelect').value = className;

            container.classList.remove('hidden');
            tbody.innerHTML = `<tr><td colspan="3" class="text-center p-12 text-slate-500"><svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังดึงข้อมูลชั้น ${className}...</td></tr>`;
            
            if (isAttendance) document.getElementById('saveBtn').disabled = true;

            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                    .withSuccessHandler((data) => processStudentData(data, isAttendance))
                    .withFailureHandler((err) => {
                        tbody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-red-500">เกิดข้อผิดพลาดในการเชื่อมต่อ</td></tr>`;
                    })
                    .getStudentsByClass(className);
            } else {
                // ทดสอบดึงข้อมูลจริงจาก Google Sheet สำหรับโหมด Preview
                const sheetId = '19YuGHh6BzXAROa5oDO1niEE-2RSIB3E6DBcWMudIMI4';
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(className)}`;

                fetch(url)
                    .then(res => res.text())
                    .then(text => {
                        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                        const json = JSON.parse(jsonString);
                        // แปลงข้อมูลจาก gviz เป็น Array 2 มิติเหมือน Apps Script
                        const headers = json.table.cols.map(c => c.label);
                        const rows = json.table.rows.map(r => r.c.map(cell => cell ? (cell.f || cell.v) : ''));
                        processStudentData([headers, ...rows], isAttendance);
                    })
                    .catch(err => {
                        console.error(err);
                        tbody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-red-500">ไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบการแชร์ไฟล์ชีตให้เป็นสาธารณะ</td></tr>`;
                    });
            }
        }

        function processStudentData(data, isAttendance) {
            const students = [];
            // วนลูปข้อมูล (เริ่มจาก 1 เพื่อข้ามหัวตาราง)
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                // โครงสร้างชีต: คอลัมน์ A(ลำดับ) = row[0], B(รหัส) = row[1], C(ชื่อ) = row[2]
                const name = row[2] ? row[2].toString().trim() : '';
                
                if (name && name !== 'ชื่อ - สกุล' && name !== 'ชื่อ-สกุล') {
                    students.push({
                        number: row[0] || '',
                        id: row[1] || '',
                        name: name
                    });
                }
            }

            currentStudents = students;
            
            if (isAttendance) {
                renderAttendanceList(students);
            } else {
                renderManageList(students);
            }
        }

        // --- ATTENDANCE FUNCTIONS ---
        function renderAttendanceList(students) {
            const tbody = document.getElementById('studentList');
            const saveBtn = document.getElementById('saveBtn');
            document.getElementById('totalCount').innerText = students.length;
            
            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center p-12 text-slate-500 bg-slate-50"><i class="fas fa-user-slash text-3xl mb-3 text-slate-300"></i><br>ไม่พบข้อมูลนักเรียนในชั้นเรียนนี้</td></tr>`;
                saveBtn.disabled = true;
            } else {
                let html = '';
                students.forEach((student, index) => {
                    // ป้องกันปัญหารหัสว่าง หรือมีช่องว่าง
                    const uid = student.id ? student.id.replace(/\\s+/g, '') : `n_${index}`;
                    
                    html += `
                    <tr class="hover:bg-blue-50/50 transition-colors border-b border-slate-100 last:border-0">
                        <td class="p-4 text-center font-bold text-slate-500 text-lg">${student.number}</td>
                        <td class="p-4">
                            <div class="font-bold text-slate-800 text-base md:text-lg">${student.name}</div>
                            <div class="text-xs text-slate-400 font-medium mt-0.5"><i class="fas fa-id-card mr-1"></i> ${student.id || '-'}</div>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex justify-center flex-wrap gap-2">
                                <div><input type="radio" id="ma_${uid}" name="status_${uid}" value="มา" class="radio-status hidden" checked><label for="ma_${uid}" class="status-ma cursor-pointer border border-slate-300 text-slate-600 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 select-none block min-w-[50px]">มา</label></div>
                                <div><input type="radio" id="khad_${uid}" name="status_${uid}" value="ขาด" class="radio-status hidden"><label for="khad_${uid}" class="status-khad cursor-pointer border border-slate-300 text-slate-600 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 select-none block min-w-[50px]">ขาด</label></div>
                                <div><input type="radio" id="puay_${uid}" name="status_${uid}" value="ลาป่วย" class="radio-status hidden"><label for="puay_${uid}" class="status-puay cursor-pointer border border-slate-300 text-slate-600 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 select-none block min-w-[50px]">ป่วย</label></div>
                                <div><input type="radio" id="kij_${uid}" name="status_${uid}" value="ลากิจ" class="radio-status hidden"><label for="kij_${uid}" class="status-kij cursor-pointer border border-slate-300 text-slate-600 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 select-none block min-w-[50px]">กิจ</label></div>
                            </div>
                        </td>
                    </tr>`;
                });
                tbody.innerHTML = html;
                saveBtn.disabled = false;
            }
        }

        function saveData() {
            const date = document.getElementById('checkDate').value;
            const subject = document.getElementById('subjectSelect').value;
            const period = document.getElementById('periodSelect').value;

            if (!date || !subject) { showToast("กรุณาเลือกวันที่และชั้นเรียนก่อนบันทึก", true); return; }

            const saveBtn = document.getElementById('saveBtn');
            const originalBtnText = saveBtn.innerHTML;
            saveBtn.disabled = true; 
            saveBtn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังบันทึก...`;

            let records = currentStudents.map((student, index) => {
                const uid = student.id ? student.id.replace(/\\s+/g, '') : `n_${index}`;
                const statusRadio = document.querySelector(`input[name="status_${uid}"]:checked`);
                return { 
                    number: student.number, 
                    id: student.id, 
                    name: student.name, 
                    status: statusRadio ? statusRadio.value : "มา", 
                    note: "" 
                };
            });

            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler((res) => {
                    saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText;
                    res.success ? showToast(res.message) : showToast(res.error, true);
                }).saveAttendance(date, subject, period, records);
            } else {
                setTimeout(() => { saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; showToast("จำลองบันทึกข้อมูลสำเร็จ!"); }, 1000);
            }
        }

        // --- MANAGEMENT (VIEW) FUNCTIONS ---
        function renderManageList(students) {
            const tbody = document.getElementById('manageStudentList');
            document.getElementById('manageTotalCount').innerText = `${students.length} คน`;
            document.getElementById('manageStudentContainer').classList.remove('hidden');
            
            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center p-12 text-slate-500 bg-slate-50">ไม่พบข้อมูลนักเรียนในชั้นเรียนนี้</td></tr>`;
                return;
            }
            
            let html = '';
            students.forEach(student => {
                html += `
                <tr class="hover:bg-indigo-50/50 transition-colors">
                    <td class="p-4 text-center font-bold text-slate-500">${student.number}</td>
                    <td class="p-4 text-slate-600 font-medium">${student.id || '-'}</td>
                    <td class="p-4 font-bold text-slate-800">${student.name}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function setLoading(show, text = "กำลังโหลด...") {
            const loader = document.getElementById('loading');
            const textEl = document.getElementById('loadingText');
            if(show) {
                loader.classList.remove('hidden');
                textEl.innerText = text;
            } else {
                loader.classList.add('hidden');
            }
        }

        function showError(msg) {
            setLoading(false);
            document.getElementById('studentList').innerHTML = `<tr><td colspan="3" class="text-center p-8 text-red-500 bg-red-50 font-medium"><i class="fas fa-exclamation-triangle mr-2"></i> ${msg}</td></tr>`;
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.firstElementChild.className = isError ? 'bg-red-600 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-3' : 'bg-green-600 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-3';
            toast.classList.remove('opacity-0', 'translate-y-[-100%]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-0'); toast.classList.add('opacity-0', 'translate-y-[-100%]', 'pointer-events-none'); }, 3000);
        }

        init();
    </script>
</body>
</html>
