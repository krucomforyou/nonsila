<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อนักเรียน ปพ.5</title>
    
    <!-- Tailwind CSS สำหรับความสวยงามและการจัดหน้ากระดาษ -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React และ ReactDOM แบบโหลดผ่าน CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel สำหรับรันโค้ด JSX ในเบราว์เซอร์ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const ATTENDANCE_STATUS = {
          present: { id: 'present', label: 'มา', color: 'bg-green-100 text-green-700', border: 'border-green-300' },
          leave: { id: 'leave', label: 'ลา', color: 'bg-blue-100 text-blue-700', border: 'border-blue-300' },
          sick: { id: 'sick', label: 'ป่วย', color: 'bg-yellow-100 text-yellow-700', border: 'border-yellow-300' },
          absent: { id: 'absent', label: 'ขาด', color: 'bg-red-100 text-red-700', border: 'border-red-300' },
          late: { id: 'late', label: 'สาย', color: 'bg-orange-100 text-orange-700', border: 'border-orange-300' },
        };

        const GRADES = ['4', '3.5', '3', '2.5', '2', '1.5', '1', '0', 'ร', 'มส'];

        const ATTR_LABELS = [
          '1. รักชาติ ศาสน์ กษัตริย์', '2. ซื่อสัตย์ สุจริต', '3. มีวินัย', '4. ใฝ่เรียนรู้', 
          '5. อยู่อย่างพอเพียง', '6. มุ่งมั่นในการทำงาน', '7. รักความเป็นไทย', '8. มีจิตสาธารณะ'
        ];

        const READ_LABELS = [
          '1. อ่านเพื่อการศึกษาค้นคว้า', '2. จับใจความสำคัญ', '3. วิเคราะห์วิจารณ์', 
          '4. ประเมินค่า', '5. ถ่ายทอดความคิด'
        ];

        const COMP_LABELS = [
          '1. ความสามารถในการสื่อสาร', '2. ความสามารถในการคิด', '3. ความสามารถในการแก้ปัญหา', 
          '4. ความสามารถในการใช้ทักษะชีวิต', '5. ความสามารถในการใช้เทคโนโลยี'
        ];

        // ข้อมูลตั้งต้นสำหรับสร้างวิชาใหม่
        const defaultCourseInfo = {
          logoUrl: '', schoolName: 'โรงเรียนโนนศิลาสว่างวิทย์', district: 'ฆ้องชัย', province: 'กาฬสินธุ์',
          area: 'สำนักงานเขตพื้นที่การศึกษาประถมศึกษากาฬสินธุ์ เขต 2', term: '1', year: '2567',
          subjectCode: 'ว14101', subjectName: 'วิทยาศาสตร์และเทคโนโลยี', teacherName: 'นายใจดี สอนสนุก',
          classLevel: 'ป.4', hours: '2', totalHours: '80', credits: '2.0', groupName: 'วิทยาศาสตร์และเทคโนโลยี',
          directorName: 'นายอารมณ์ จารุทรัพย์สดใส', scoreRatio: '70 : 30',
          description: 'ศึกษา อธิบายความหมายของเทคโนโลยี...',
          indicators: 'มาตรฐานการเรียนรู้...'
        };

        const defaultStructure = [
          { id: 's1', unitGroup: 'สาระที่ 1', unitName: 'มาตรฐาน 1.1', indicators: 'ตัวชี้วัด', hours: '10', s_t1_1: '5', s_t1_pre: '5', s_t1_2: '', s_t1_mid: '10', s_t2_1: '', s_t2_pre: '', s_t2_2: '', s_t2_fin: '' }
        ];

        const defaultStudents = [
          { id: 'u1', studentId: '1001', number: 1, name: 'เด็กชายสมชาย ใจดี' },
        ];

        const defaultMaxScores = {
          s1_1: '10', s1_pre: '10', s1_2: '15', s1_mid: '15',
          s2_1: '10', s2_pre: '10', s2_2: '15', s2_fin: '15'
        };

        function App() {
          const [activeTab, setActiveTab] = useState('manage');

          // ==================== ระบบจัดการหลายวิชา (Multi-Subject State) ====================
          const [subjects, setSubjects] = useState(() => {
            const saved = localStorage.getItem('p5_subjects_db');
            if (saved) return JSON.parse(saved);
            return [{
              id: Math.random().toString(36).substr(2, 9),
              courseInfo: defaultCourseInfo,
              courseStructure: defaultStructure,
              students: defaultStudents,
              attendanceData: {},
              scores: {},
              evaluations: {},
              maxScores: defaultMaxScores
            }];
          });

          const [activeSubjectId, setActiveSubjectId] = useState(subjects[0]?.id);

          // Auto-Save ทุกครั้งที่มีการเปลี่ยนแปลงข้อมูล
          useEffect(() => {
            localStorage.setItem('p5_subjects_db', JSON.stringify(subjects));
          }, [subjects]);

          // ดึงข้อมูลวิชาที่กำลังเปิดอยู่ปัจจุบัน
          const activeSubject = subjects.find(s => s.id === activeSubjectId) || subjects[0];
          const { courseInfo, courseStructure, students, attendanceData, scores, evaluations, maxScores } = activeSubject;

          // ฟังก์ชันอัปเดตข้อมูลวิชาปัจจุบัน
          const updateActiveSubject = (field, updater) => {
            setSubjects(prev => prev.map(sub => {
              if (sub.id !== activeSubjectId) return sub;
              const newValue = typeof updater === 'function' ? updater(sub[field]) : updater;
              return { ...sub, [field]: newValue };
            }));
          };

          const setCourseInfo = (val) => updateActiveSubject('courseInfo', val);
          const setCourseStructure = (val) => updateActiveSubject('courseStructure', val);
          const setStudents = (val) => updateActiveSubject('students', val);
          const setAttendanceData = (val) => updateActiveSubject('attendanceData', val);
          const setScores = (val) => updateActiveSubject('scores', val);
          const setEvaluations = (val) => updateActiveSubject('evaluations', val);
          const setMaxScores = (val) => updateActiveSubject('maxScores', val);

          // --- การจัดการฐานข้อมูลวิชา ---
          const handleAddNewSubject = () => {
            const newSub = {
              id: Math.random().toString(36).substr(2, 9),
              courseInfo: { ...courseInfo, subjectName: 'วิชาใหม่ (เปลี่ยนชื่อได้ที่เมนูข้อมูลวิชา)', subjectCode: 'รหัสใหม่' },
              courseStructure: [...courseStructure],
              students: [...students],
              attendanceData: {},
              scores: {},
              evaluations: {},
              maxScores: { ...maxScores }
            };
            setSubjects([...subjects, newSub]);
            setActiveSubjectId(newSub.id);
            alert('สร้างรายวิชาใหม่เรียบร้อยแล้ว (ระบบคัดลอกรายชื่อนักเรียนจากวิชาเดิมมาให้แล้วครับ)');
          };

          const handleDeleteSubject = () => {
            if (subjects.length <= 1) return alert('ไม่สามารถลบได้ ต้องมีอย่างน้อย 1 รายวิชาในระบบ');
            if (window.confirm(`ยืนยันการลบวิชา ${courseInfo.subjectName} ใช่หรือไม่? ข้อมูลจะหายไปถาวร`)) {
              const newSubjects = subjects.filter(s => s.id !== activeSubjectId);
              setSubjects(newSubjects);
              setActiveSubjectId(newSubjects[0].id);
            }
          };

          // ==================== ระบบ Google Sheets Integration ====================
          const [sheetId, setSheetId] = useState(localStorage.getItem('p5_sheet_id') || '1kJhRIvRYz2_nChEEKBo-w5GvkTEdPItK5XjvPOjnH5M');
          const [scriptUrl, setScriptUrl] = useState(localStorage.getItem('p5_script_url') || 'https://script.google.com/macros/s/AKfycbwlnJwi82DYRfLrYVdNkqM8PPk9P0yxqRHAwArbAeFQaviD4EniyxwjfYLhb49H_NF9/exec');
          const [isSaving, setIsSaving] = useState(false);

          const saveToGoogleSheet = async () => {
            if (!scriptUrl) return alert("กรุณาใส่ Web App URL ของ Google Apps Script ก่อนครับ");
            if (!sheetId) return alert("กรุณาใส่ Sheet ID");
            
            setIsSaving(true);
            localStorage.setItem('p5_sheet_id', sheetId);
            localStorage.setItem('p5_script_url', scriptUrl);

            try {
              const payload = {
                action: "saveData",
                sheetId: sheetId,
                subjectName: courseInfo.subjectName,
                subjectCode: courseInfo.subjectCode,
                classLevel: courseInfo.classLevel,
                termYear: `${courseInfo.term}/${courseInfo.year}`,
                studentsCount: students.length,
                jsonData: JSON.stringify(activeSubject)
              };

              await fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              
              alert("ส่งคำสั่งบันทึกข้อมูลไปยัง Google Sheets เรียบร้อยแล้ว!\n(กรุณาเปิดตรวจสอบในไฟล์ Google Sheets ของคุณ)");
            } catch (err) {
              alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + err.message);
            }
            setIsSaving(false);
          };

          // ==================== ส่วนทำงานเดิม ====================
          const handleLogoUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => setCourseInfo({ ...courseInfo, logoUrl: reader.result });
              reader.readAsDataURL(file);
            }
          };

          const handleMaxScoreChange = (field, value) => setMaxScores(prev => ({ ...prev, [field]: value }));
          const max_s1_total_pre = (Number(maxScores.s1_1)||0) + (Number(maxScores.s1_pre)||0) + (Number(maxScores.s1_2)||0);
          const max_s1_total = max_s1_total_pre + (Number(maxScores.s1_mid)||0);
          const max_s2_total_pre = (Number(maxScores.s2_1)||0) + (Number(maxScores.s2_pre)||0) + (Number(maxScores.s2_2)||0);
          const max_s2_total = max_s2_total_pre + (Number(maxScores.s2_fin)||0);
          const max_totalScore = max_s1_total + max_s2_total;

          const handleAddStructureRow = () => setCourseStructure(prev => [...prev, { id: Math.random().toString(36).substr(2, 9), unitGroup: '', unitName: '', indicators: '', hours: '', s_t1_1: '', s_t1_pre: '', s_t1_2: '', s_t1_mid: '', s_t2_1: '', s_t2_pre: '', s_t2_2: '', s_t2_fin: '' }]);
          const handleRemoveStructureRow = (id) => { if (window.confirm('ยืนยันการลบหน่วยการเรียนรู้นี้?')) setCourseStructure(prev => prev.filter(s => s.id !== id)); };
          const handleStructureChange = (id, field, value) => setCourseStructure(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));

          const structureTotals = courseStructure.reduce((acc, row) => ({
            hours: acc.hours + (Number(row.hours) || 0), s_t1_1: acc.s_t1_1 + (Number(row.s_t1_1) || 0), s_t1_pre: acc.s_t1_pre + (Number(row.s_t1_pre) || 0), s_t1_2: acc.s_t1_2 + (Number(row.s_t1_2) || 0), s_t1_mid: acc.s_t1_mid + (Number(row.s_t1_mid) || 0), s_t2_1: acc.s_t2_1 + (Number(row.s_t2_1) || 0), s_t2_pre: acc.s_t2_pre + (Number(row.s_t2_pre) || 0), s_t2_2: acc.s_t2_2 + (Number(row.s_t2_2) || 0), s_t2_fin: acc.s_t2_fin + (Number(row.s_t2_fin) || 0),
            totalScore: acc.totalScore + (Number(row.s_t1_1)||0) + (Number(row.s_t1_pre)||0) + (Number(row.s_t1_2)||0) + (Number(row.s_t1_mid)||0) + (Number(row.s_t2_1)||0) + (Number(row.s_t2_pre)||0) + (Number(row.s_t2_2)||0) + (Number(row.s_t2_fin)||0)
          }), { hours: 0, s_t1_1: 0, s_t1_pre: 0, s_t1_2: 0, s_t1_mid: 0, s_t2_1: 0, s_t2_pre: 0, s_t2_2: 0, s_t2_fin: 0, totalScore: 0 });

          const [newStudent, setNewStudent] = useState({ studentId: '', number: '', name: '' });
          const handleAddStudent = () => {
            if (!newStudent.studentId || !newStudent.name) return alert('กรุณากรอกรหัสและชื่อนักเรียน');
            setStudents(prev => [...prev, { id: Math.random().toString(36).substr(2, 9), studentId: newStudent.studentId, number: Number(newStudent.number), name: newStudent.name }].sort((a, b) => a.number - b.number));
            setNewStudent({ studentId: '', number: '', name: '' });
          };
          const handleDeleteStudent = (id) => { if (window.confirm('ยืนยันการลบนักเรียนคนนี้?')) setStudents(prev => prev.filter(s => s.id !== id)); };
          const updateStudentInfo = (id, field, value) => setStudents(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));

          // --- การเช็คชื่อแบบรองรับ 2 คาบติดกัน ---
          const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);
          const [currentPeriod, setCurrentPeriod] = useState('1'); // '1' = คาบแรก/คาบเดียว, '2' = คาบที่สอง
          
          const attendanceKey = `${currentDate}_${currentPeriod}`;

          const markAttendance = (id, status) => { 
            setAttendanceData(prev => { 
              const td = prev[attendanceKey] || {}; 
              return { ...prev, [attendanceKey]: { ...td, [id]: td[id] === status ? null : status } }; 
            }); 
          };
          
          const markAllPresent = () => { 
            setAttendanceData(prev => { 
              const td = {}; 
              students.forEach(s => td[s.id] = 'present'); 
              return { ...prev, [attendanceKey]: td }; 
            }); 
          };

          const handleScoreChange = (id, field, value) => setScores(prev => ({ ...prev, [id]: { ...(prev[id] || {}), [field]: value === '' ? '' : Number(value) } }));
          const handleEvalChange = (id, type, index, value) => setEvaluations(prev => ({ ...prev, [id]: { ...(prev[id] || {}), [`${type}_${index}`]: value === '' ? '' : Number(value) } }));

          const calculateGrade = (total) => {
            if (total >= 80) return '4'; if (total >= 75) return '3.5'; if (total >= 70) return '3'; if (total >= 65) return '2.5';
            if (total >= 60) return '2'; if (total >= 55) return '1.5'; if (total >= 50) return '1'; return '0';
          };

          const { summaryData, gradeStats } = useMemo(() => {
            const stats = { '4': 0, '3.5': 0, '3': 0, '2.5': 0, '2': 0, '1.5': 0, '1': 0, '0': 0, 'ร': 0, 'มส': 0 };
            const summarized = students.map(student => {
              const attStats = { present: 0, leave: 0, sick: 0, absent: 0, late: 0, total: 0 };
              Object.values(attendanceData).forEach(day => { if (day[student.id]) { attStats[day[student.id]]++; attStats.total++; } });
              const stScore = scores[student.studentId] || {};
              const s1_1 = Number(stScore.s1_1) || 0; const s1_pre = Number(stScore.s1_pre) || 0; const s1_2 = Number(stScore.s1_2) || 0;
              const s1_total_pre = s1_1 + s1_pre + s1_2; const s1_mid = Number(stScore.s1_mid) || 0; const s1_total = s1_total_pre + s1_mid;
              const s2_1 = Number(stScore.s2_1) || 0; const s2_pre = Number(stScore.s2_pre) || 0; const s2_2 = Number(stScore.s2_2) || 0;
              const s2_total_pre = s2_1 + s2_pre + s2_2; const s2_fin = Number(stScore.s2_fin) || 0; const s2_total = s2_total_pre + s2_fin;
              const totalScore = s1_total + s2_total; const grade = calculateGrade(totalScore);
              stats[grade] = (stats[grade] || 0) + 1; 

              const stEval = evaluations[student.studentId] || {};
              const getAvg = (type, count) => {
                let total = 0; let hasData = false;
                for (let i = 1; i <= count; i++) { if (stEval[`${type}_${i}`] !== undefined && stEval[`${type}_${i}`] !== '') { total += Number(stEval[`${type}_${i}`]); hasData = true; } }
                return hasData ? Math.round(total / count) : ''; 
              };

              return { 
                ...student, attStats, 
                scores: { ...stScore, s1_total_pre, s1_total, s2_total_pre, s2_total, totalScore, grade },
                evaluations: { attrAvg: getAvg('attr', 8), readAvg: getAvg('read', 5), compAvg: getAvg('comp', 5) }
              };
            });
            return { summaryData: summarized, gradeStats: stats };
          }, [students, attendanceData, scores, evaluations]);


          const TABS = [
            { id: 'manage', label: 'ฐานข้อมูล/สำรองข้อมูล', icon: <i className="fas fa-database text-lg"></i>, color: 'text-indigo-600 font-bold bg-indigo-50 border-indigo-200' },
            { id: 'settings', label: 'ข้อมูลวิชา (ปก)', icon: <i className="fas fa-cog text-lg"></i> },
            { id: 'description', label: 'คำอธิบายรายวิชา', icon: <i className="fas fa-book-open text-lg"></i> },
            { id: 'structure', label: 'โครงสร้างรายวิชา', icon: <i className="fas fa-list-ol text-lg"></i> },
            { id: 'students', label: 'รายชื่อนักเรียน', icon: <i className="fas fa-users text-lg"></i> },
            { id: 'attendance', label: 'เวลาเรียน', icon: <i className="fas fa-calendar-check text-lg"></i> },
            { id: 'scores', label: 'บันทึกคะแนน', icon: <i className="fas fa-edit text-lg"></i> },
            { id: 'evaluation', label: 'ประเมิน/สมรรถนะ', icon: <i className="fas fa-check-square text-lg"></i> },
            { id: 'summary', label: 'สรุปผล ปพ.5', icon: <i className="fas fa-chart-bar text-lg"></i> },
            { id: 'print_all', label: 'พิมพ์ ปพ.5 (ทั้งหมด)', icon: <i className="fas fa-file-export text-lg"></i> },
          ];

          const isPreview = activeTab === 'print_all';
          
          // เรียงวันที่ให้ถูกต้องตามเวลาและคาบเรียน
          const allSortedDates = Object.keys(attendanceData).sort();
          const dateChunks = [];
          if (allSortedDates.length === 0) dateChunks.push(Array(20).fill(null));
          else {
            for (let i = 0; i < allSortedDates.length; i += 20) {
              const chunk = allSortedDates.slice(i, i + 20);
              while (chunk.length < 20) { chunk.push(null); }
              dateChunks.push(chunk);
            }
          }

          return (
            <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row text-slate-800">
              
              <style>
                {`
                  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
                  @font-face { font-family: 'TH Niramit AS'; src: local('TH Niramit AS'), local('THNiramitAS'); }
                  body, input, button, select, textarea, table, th, td, span, div, h1, h2, h3, p { font-family: 'TH Niramit AS', 'Sarabun', sans-serif !important; }

                  @media screen {
                    .is-preview .a4-page {
                      width: 210mm !important; min-height: 297mm !important; 
                      margin: 0 auto 2rem auto !important; padding: 15mm 20mm !important;
                      background: white !important;
                      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05) !important;
                      border: 1px solid #cbd5e1 !important; border-radius: 0 !important; display: block !important;
                    }
                  }
                  .force-black-text, .force-black-text * { color: #000 !important; }
                  @media print {
                    @page { size: A4 portrait; margin: 15mm; }
                    body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background: white !important; }
                    .a4-page { width: 100% !important; min-height: 267mm !important; height: auto !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; page-break-inside: avoid !important; page-break-after: always !important; break-after: page !important; display: block !important; }
                    .a4-page:last-of-type { page-break-after: auto !important; break-after: auto !important; }
                    .print-bg-clear { background-color: transparent !important; }
                    table { border-collapse: collapse !important; width: 100% !important; }
                    th, td { border: 1px solid #000 !important; color: #000 !important; }
                  }
                  .score-input { width: 100%; height: 100%; text-align: center; background: transparent; outline: none; padding: 2px 0; -moz-appearance: textfield; }
                  .score-input::-webkit-outer-spin-button, .score-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
                `}
              </style>

              {/* Sidebar */}
              <div className={`w-full md:w-64 bg-white border-r border-slate-200 flex-shrink-0 shadow-sm print:hidden ${isPreview ? 'hidden md:block' : 'block'}`}>
                <div className="p-6 border-b border-slate-100">
                  <h1 className="text-xl font-bold text-blue-700">ระบบ ปพ.5</h1>

                    {isPreview && <h2 className="text-center font-bold text-[18pt] mb-6 mt-4 print:block">ตารางสรุปผลการเรียนรวม ปพ.5</h2>}
                    
                    <div className="overflow-x-auto p-4 print:p-0">
                      <table className="w-full text-center border-collapse text-[14pt]">
                        <thead>
                          <tr className="bg-blue-100 print-bg-clear">
                            <th className="border border-slate-600 p-2">เลขที่</th>
                            <th className="border border-slate-600 p-2 text-left px-3">รหัส / ชื่อ - สกุล</th>
                            <th className="border border-slate-600 p-2 print-bg-clear">มาเรียน<br/>(วัน)</th>
                            <th className="border border-slate-600 p-2 print-bg-clear">คะแนนรวม<br/>(100)</th>
                            <th className="border border-slate-600 p-2 print-bg-clear">เกรด</th>
                            <th className="border border-slate-600 p-2 print-bg-clear">เฉลี่ย<br/>คุณลักษณะฯ</th>
                            <th className="border border-slate-600 p-2 print-bg-clear">เฉลี่ย<br/>อ่านคิดฯ</th>
                            <th className="border border-slate-600 p-2 print-bg-clear">เฉลี่ย<br/>สมรรถนะฯ</th>
                          </tr>
                        </thead>
                        <tbody>
                          {summaryData.map(s => (
                            <tr key={s.id} className="hover:bg-slate-50">
                              <td className="p-2 border border-slate-300">{s.number}</td>
                              <td className="p-2 border border-slate-300 text-left px-3 whitespace-nowrap">
                                <span className="text-[12pt] mr-2 print-bg-clear">{s.studentId}</span> {s.name}
                              </td>
                              <td className="p-2 border border-slate-300 print-bg-clear">{s.attStats.present}</td>
                              <td className="p-2 border border-slate-300 font-bold">{s.scores.totalScore}</td>
                              <td className="p-2 border border-slate-300 font-bold print-bg-clear">{s.scores.grade !== '0' || s.scores.totalScore > 0 ? s.scores.grade : ''}</td>
                              <td className="p-2 border border-slate-300 print-bg-clear">{s.evaluations.attrAvg !== '' ? s.evaluations.attrAvg : '-'}</td>
                              <td className="p-2 border border-slate-300 print-bg-clear">{s.evaluations.readAvg !== '' ? s.evaluations.readAvg : '-'}</td>
                              <td className="p-2 border border-slate-300 print-bg-clear">{s.evaluations.compAvg !== '' ? s.evaluations.compAvg : '-'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
